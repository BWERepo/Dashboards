# Publishes the BWE Dashboard as a read-only website on Cloudflare Pages, rebuilt every 30 minutes from GitHub data.
# The page is built on the runner and uploaded straight to Cloudflare; it is never committed to this (public) repo and the build
# prints nothing about the data, so the Action log shows no project information. Protect the Pages site with Cloudflare Access.
# Setup: project-dashboard/SITE-SETUP.md. Secrets (names only): DASHBOARD_GH_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Publish dashboard site

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the site (no output)
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
        run: node project-dashboard/build.mjs --site site-out
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site-out --project-name bwe-dashboard --branch main --commit-dirty=true >/dev/null 2>&1 || { echo "Publishing to Cloudflare failed."; exit 1; }
