# Publishes the BWE Dashboard as a read-only website on Cloudflare Pages, rebuilt every 30 minutes from GitHub data.
# The page is built on the runner and uploaded straight to Cloudflare; it is never committed to this (public) repo and the build
# prints nothing about the data, so the Action log shows no project information. Protect the Pages site with Cloudflare Access.
# Setup: project-dashboard/SITE-SETUP.md. Secrets (names only): DASHBOARD_GH_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Publish dashboard site

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Until all three secrets are saved (SITE-SETUP.md steps 1-3), skip quietly instead of failing every 30 minutes.
      - name: Check the secrets are set
        id: secrets
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$GH_TOKEN" ] || missing="$missing DASHBOARD_GH_TOKEN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Site not published: repo secret(s) not set:$missing. See project-dashboard/SITE-SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      # All build output is discarded: this repo is public, so its Action logs are too, and the build's output holds project data.
      - name: Build the site (no output)
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
        run: node project-dashboard/build.mjs --site site-out >/dev/null 2>&1 || { echo "Building the site failed."; exit 1; }
      - name: Publish to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site-out --project-name bwe-dashboard --branch main --commit-dirty=true >/dev/null 2>&1 || { echo "Publishing to Cloudflare failed."; exit 1; }
