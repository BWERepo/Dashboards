<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Status Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--mute:#5d6672;--line:#e1e5ea;--ok:#157347;--warn:#b26a00;--bad:#b3261e;--accent:#1a56db;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#98a2ae;--line:#2a3039;--ok:#4cc38a;--warn:#e0a03a;--bad:#f2766d;--accent:#7aa2ff;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:8px 16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:12px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:16px;margin:0 0 2px}
.big{font-size:24px;font-weight:650;line-height:1.2}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.row div{min-width:64px}.row small{display:block;color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
h3{font-size:15px;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;background:var(--chip)}
tr:last-child td{border-bottom:0}
td.path{word-break:break-all;font:13px ui-monospace,Consolas,monospace}
a{color:var(--accent)}
.rbtn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 14px;border-radius:8px;cursor:pointer;margin-left:8px}
.ask{border-left:4px solid var(--warn);background:var(--chip);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.asktext{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.opt{font:inherit;border:1px solid var(--accent);background:var(--card);color:var(--accent);padding:4px 12px;border-radius:8px;cursor:pointer}
.joblog{max-height:320px;overflow:auto;background:var(--chip);border-radius:8px;padding:10px;margin:0 0 10px}
textarea{flex:1;min-width:220px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
#auto{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-left:8px}
.rbtn:disabled{opacity:.6;cursor:wait}
.ibtn:disabled{opacity:.45;cursor:not-allowed}
.gitsel{font:inherit;padding:5px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.gitsel:disabled{opacity:.6;cursor:wait}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Consolas,monospace;margin:8px 0 2px}
ul.items{margin:6px 0;padding-left:20px}ul.items li{margin:3px 0}
code{font:13px ui-monospace,Consolas,monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
.empty{color:var(--mute);padding:18px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.tbl{overflow-x:auto}
.card.pick{cursor:pointer}.card.pick:hover,.card.pick:focus-visible{border-color:var(--accent);outline:none}
body.locked{overflow:hidden}
.full{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column}
.full[hidden]{display:none}
.fbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.fbar h2{font-size:19px;margin:0}
.fbar .grow{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--card);color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.ibtn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:8px;cursor:pointer}
.fbody{flex:1;min-height:0;overflow:auto;padding:12px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.col>h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colbody{flex:1;min-height:0;overflow:auto;padding:10px 14px}
@media (max-width:900px){.cols{grid-template-columns:1fr;height:auto}.colbody{overflow:visible}}
.need{border:2px solid var(--bad);border-radius:10px;background:var(--card);margin:12px 16px 0;padding:10px 14px;max-height:45vh;overflow:auto}
.needhead{font-size:20px;font-weight:800;letter-spacing:.03em;color:var(--bad);text-transform:uppercase}
.needitem{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px}
.needitem:first-of-type{border-top:0;margin-top:0}
.msg{margin:8px 0;padding:8px 11px;border-radius:10px;max-width:92%;background:var(--chip)}
.msg.user{margin-left:auto;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.msg.tool{background:none;padding:1px 11px;margin:2px 0;font:12px/1.45 ui-monospace,Consolas,monospace;color:var(--mute);word-break:break-all}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.meta{font-size:12px;color:var(--mute)}
.sess{padding:6px 12px}
.sess>summary{font-weight:600}
.ev{border-bottom:1px solid var(--line);padding:8px 0}
.ev:last-child{border-bottom:0}
.ev details{border:0;padding:0;margin:4px 0 0;background:none}
.ev summary{font-weight:400;font-size:13px;color:var(--mute)}
.filters{display:inline-flex;gap:4px;flex-wrap:wrap;font-weight:400}
.filters button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:2px 9px;border-radius:99px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Project Status Dashboard</h1>
  <div class="sub" id="gen"></div>
</header>
<main>
  <div class="grid" id="cards"></div>
  <nav id="tabs"></nav>
  <section id="detail"></section>
</main>
<div id="full" class="full" role="dialog" aria-modal="true" aria-labelledby="ftitle" hidden></div>
<script>
window.addEventListener("error", (e) => {
  const d = document.querySelector("#detail") || document.body;
  d.insertAdjacentHTML("afterbegin", `<div class="empty bad">The dashboard hit an error: ${String(e.message).replace(/</g, "&lt;")} (line ${e.lineno}).</div>`);
});
const DATA = /*__DATA__*/null;
if (!DATA) throw new Error("This is the blank page-template.html, not the dashboard. Run refresh.cmd.");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (iso) => { if (!iso) return "never"; const h = (Date.now() - Date.parse(iso)) / 36e5; return h < 1 ? "just now" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago"; };
// Browser-local time, 12-hour clock.
const fmt = (iso) => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }) : "-";
const md = (s) => esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/`([^`\n]+)`/g, "<code>$1</code>");
// The open project is kept in the address (#p=KEY) so a reload comes back to it.
let tab = (() => { const k = decodeURIComponent((location.hash.match(/^#p=(.+)$/) || [])[1] || ""); return DATA.projects.some((p) => p.key === k) ? k : "overview"; })();
let view = "messages", ghFilter = "all";

const SERVER = "http://127.0.0.1:8788";
const AUTO_KEY = "projdash-auto";
const getAuto = () => { try { return localStorage.getItem(AUTO_KEY) || "0"; } catch { return "0"; } };
$("#gen").innerHTML = `<span id="stamp"></span> <select id="auto" aria-label="Auto refresh"><option value="0">Auto-refresh off</option><option value="5">Every 5 min</option><option value="15">Every 15 min</option><option value="60">Every hour</option></select><button id="refresh" class="rbtn">Refresh now</button>`;
$("#stamp").textContent = "Data pulled " + fmt(DATA.generatedAt) + " (" + ago(DATA.generatedAt) + ").";
async function refresh(manual) {
  const b = $("#refresh");
  b.disabled = true; b.textContent = "Refreshing...";
  try {
    const onServer = location.protocol === "http:";
    const r = await fetch((onServer ? "" : SERVER) + "/refresh", { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    if (onServer) location.reload(); else location.href = SERVER; // a file copy moves to the live page
  } catch (err) {
    b.disabled = false; b.textContent = "Refresh now";
    $("#stamp").textContent = location.protocol === "http:" ? "Refresh failed: " + err.message : "The local server is not running. Double-click refresh.cmd, then try again.";
  }
}
$("#refresh").onclick = () => refresh(true);
$("#auto").value = getAuto();
$("#auto").onchange = (e) => { try { localStorage.setItem(AUTO_KEY, e.target.value); } catch {} location.reload(); };
if (getAuto() !== "0" && location.protocol === "http:") setTimeout(() => refresh(false), Number(getAuto()) * 60000);

// Outstanding = open GitHub issues + open PRs + the newest "still open" list from PROJECT_STATUS.md.
// Ahead AND behind means local and remote have split (often squash-merged PRs), so "unpushed" is not a real count.
const diverged = (p) => !!(p.git && p.git.ahead && p.git.behind);
const counts = (p) => ({
  uncommitted: p.git?.files.length ?? 0,
  unpushed: p.git?.unpushed.length ?? 0,
  issues: p.remote.issues.length,
  prs: p.remote.prs.length,
  todo: p.doc?.totalOpen ?? 0,
});
function status(p) {
  if (p.error) return ["Git error", "bad"];
  const c = counts(p);
  if (diverged(p)) return c.uncommitted ? ["Needs commit", "warn"] : ["Diverged", "warn"];
  if (c.uncommitted || c.unpushed) return ["Needs commit", "warn"];
  if (p.git.behind) return ["Behind remote", "warn"];
  if (c.issues || c.prs) return ["Open items", "warn"];
  return ["Clean", "ok"];
}

function cards() {
  $("#cards").innerHTML = DATA.projects.map((p) => {
    const [label, cls] = status(p), c = counts(p);
    const b = badge(p.key) || (asking(p).length ? `<span class="pill bad">&#9888; USER INPUT NEEDED</span>` : "");
    return `<div class="card pick" tabindex="0" role="button" data-open="${esc(p.key)}" aria-label="Open ${esc(p.key)} full screen"><h2>${esc(p.key)}</h2><div class="sub">${esc(p.name)}</div>
      <div class="big ${cls}">${label}</div>${b ? `<div>${b}</div>` : ""}
      <div class="sub">${p.git ? esc(p.git.branch) + " · last commit " + ago(p.git.last.date) : esc(p.error)}</div>
      <div class="row"><div><b class="${c.uncommitted ? "warn" : ""}">${c.uncommitted}</b><small>To commit</small></div>${diverged(p) ? `<div title="Local and remote have split"><b class="warn">+${p.git.ahead}/-${p.git.behind}</b><small>Diverged</small></div>` : `<div><b class="${c.unpushed ? "warn" : ""}">${c.unpushed}</b><small>To push</small></div>`}<div><b class="${c.issues ? "warn" : ""}">${c.issues}</b><small>Issues</small></div><div><b>${c.prs}</b><small>Open PRs</small></div></div>
      ${p.git ? gitButtons(p, c) : ""}
    </div>`;
  }).join("");
}

function tabs() {
  const items = [["overview", "Overview"], ...DATA.projects.map((p) => [p.key, p.key])];
  $("#tabs").innerHTML = items.map(([k, n]) => `<button aria-pressed="${tab === k}" data-k="${k}">${esc(n)}</button>`).join("");
  $("#tabs").onclick = (e) => { const k = e.target.dataset.k; if (k) openProject(k); };
}
$("#cards").onclick = (e) => { if (e.target.closest("[data-git]")) return; const c = e.target.closest("[data-open]"); if (c) openProject(c.dataset.open); };
$("#cards").onchange = (e) => { const s = e.target.closest("select[data-git]"); if (s && s.value) { const act = s.value; s.value = ""; gitAction(s.dataset.key, act); } };
$("#cards").onkeydown = (e) => { if (e.target.closest("[data-git]")) return; const c = e.target.closest("[data-open]"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openProject(c.dataset.open); } };

// A Git dropdown on every card: Commit, Push, Commit & push, Pull, and Pull & push (the fix for "Diverged").
// A choice with nothing to do is greyed out with the reason.
// Push is a plain `git push` to the upstream, never a force push, so it is off when the branch is behind or has diverged.
// State lives here, not in the DOM, because cards() redraws every few seconds.
const gitBusy = {}, gitNote = {};
function gitButtons(p, c) {
  const pushBlock = diverged(p) ? "diverged, pull and merge first" : p.git.behind ? "remote is ahead, pull first" : "";
  const opt = (act, label, why) => `<option value="${act}" ${why ? "disabled" : ""}>${label}${why ? ` (${esc(why)})` : ""}</option>`;
  const note = gitNote[p.key];
  return `<div class="tools" style="margin:10px 0 0"><select class="gitsel" data-git data-key="${esc(p.key)}" aria-label="Git actions for ${esc(p.key)}" ${gitBusy[p.key] ? "disabled" : ""}>
    <option value="">Git...</option>
    ${opt("commit", "Commit", c.uncommitted ? "" : "nothing to commit")}
    ${opt("push", "Push", pushBlock || (c.unpushed ? "" : "nothing to push"))}
    ${opt("both", "Commit &amp; push", pushBlock || (c.uncommitted ? "" : "nothing to commit"))}
    ${opt("pull", "Pull", !p.git.upstream ? "no upstream" : !p.git.behind ? "up to date" : c.uncommitted ? "commit first" : "")}
    ${opt("sync", "Pull &amp; push", !p.git.upstream ? "no upstream" : !(p.git.behind && p.git.ahead) ? "only for diverged" : c.uncommitted ? "commit first" : "")}
  </select></div>${note ? `<div class="note ${note.bad ? "bad" : ""}" style="white-space:pre-wrap">${esc(note.text)}</div>` : ""}`;
}
async function gitAction(key, act) {
  const p = DATA.projects.find((x) => x.key === key), g = p.git;
  const say = (text, bad) => { gitNote[p.key] = { text, bad }; if (!document.activeElement?.matches?.("#cards select")) cards(); };
  const files = g.files.map((f) => `${f.kind}: ${f.path}`), list = (a) => a.slice(0, 15).join("\n") + (a.length > 15 ? `\n...and ${a.length - 15} more` : "");
  let message = "";
  if (act === "commit" || act === "both") {
    message = prompt(`${act === "both" ? "Commit and push" : "Commit"} all ${files.length} changed file(s) in ${p.key} on ${g.branch}:\n\n${list(files)}\n\nCommit message:`, `Update ${files.length} file${files.length > 1 ? "s" : ""}`);
    if (message === null) return;
    if (!message.trim()) { say("A commit message is needed.", true); return; }
  } else if (act === "push" && !confirm(`Push ${g.unpushed.length} commit(s) on ${g.branch} to ${g.upstream || "origin"} for ${p.key}?\n\n${list(g.unpushed)}`)) return;
  else if (act === "pull" && !confirm(`Pull ${g.behind} commit(s) from ${g.upstream} into ${p.key}?${g.ahead ? `\n\nYour ${g.ahead} local commit(s) are replayed on top.` : ""}`)) return;
  else if (act === "sync" && !confirm(`Fix the diverged ${p.key}?\n\n1. Pull GitHub's ${g.behind} commit(s) and replay your ${g.ahead} local commit(s) on top (any already on GitHub are dropped).\n2. Push the result.\n\nIf the two sides conflict, the pull is undone and nothing changes.\n\nYour local commits:\n${list(g.unpushed)}`)) return;
  if (location.protocol !== "http:") { say("This needs the local server. Double-click refresh.cmd, then try again.", true); return; }
  // A running clock shows from the press until the page reloads, for the git step and then the dashboard rebuild.
  const t0 = Date.now();
  let step = { commit: "Committing", push: "Pushing", both: "Committing and pushing", pull: "Pulling", sync: "Pulling and pushing" }[act];
  const tick = () => { const s = Math.floor((Date.now() - t0) / 1000); say(`\u23F1 ${step}... ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`); };
  gitBusy[p.key] = true; tick();
  const timer = setInterval(tick, 1000);
  try {
    const r = await fetch("/git/" + encodeURIComponent(p.key), { method: "POST", body: JSON.stringify({ action: act, message }) });
    if (!r.ok) throw new Error(await r.text());
    step = "Done. Updating the dashboard"; tick();
    await fetch("/refresh", { method: "POST" }).catch(() => {});
    location.reload();
  } catch (err) { clearInterval(timer); gitBusy[p.key] = false; say("Failed: " + err.message, true); }
}

// Selecting a project opens it over the whole window and asks the browser for real full screen too.
function openProject(k) {
  tab = k; view = "messages";
  history.replaceState(null, "", k === "overview" ? location.pathname : "#p=" + encodeURIComponent(k));
  if (k !== "overview" && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  tabs(); render();
}
function closeProject() {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  openProject("overview");
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tab !== "overview" && !document.fullscreenElement) closeProject(); });

const prCell = (pr) => pr ? `<a href="${esc(pr.url)}" target="_blank" rel="noopener">#${pr.number}</a> <span class="pill ${pr.state === "merged" ? "ok" : pr.state === "closed" ? "bad" : "warn"}">${esc(pr.state)}</span><div class="meta">${esc(pr.title)}</div>` : `<span class="meta">No PR</span>`;
// What is waiting: the unpushed commit messages, then the changed files.
function describe(p) {
  const g = p.git, more = (n, shown) => n > shown ? `<li class="meta">and ${n - shown} more</li>` : "";
  const commits = g.unpushed.slice(0, 5).map((c) => `<li>${esc(c.slice(8))}</li>`).join("") + more(g.unpushed.length, 5);
  const files = g.files.slice(0, 5).map((f) => `<li><code>${esc(f.path)}</code> <span class="meta">${f.kind}</span></li>`).join("") + more(g.files.length, 5);
  return (commits ? `<div class="meta">Commits</div><ul class="items">${commits}</ul>` : "") + (files ? `<div class="meta">Changed files</div><ul class="items">${files}</ul>` : "") || "-";
}
function overview() {
  const commit = DATA.projects.filter((p) => p.git && (p.git.files.length || p.git.unpushed.length));
  const issues = DATA.projects.flatMap((p) => [...p.remote.issues.map((i) => ({ p, t: "Issue", ...i })), ...p.remote.prs.map((i) => ({ p, t: i.isDraft ? "Draft PR" : "PR", ...i }))]);
  return `<h3>Items to commit</h3>` + (commit.length ? `<div class="tbl"><table><tr><th>Project</th><th>Branch</th><th>PR</th><th>Description</th><th>Uncommitted files</th><th>Unpushed commits</th></tr>
    ${commit.map((p) => `<tr><td>${esc(p.key)}</td><td>${esc(p.git.branch)}</td><td>${prCell(p.branchPr)}</td><td>${describe(p)}</td><td>${p.git.files.length}</td><td>${diverged(p) ? `diverged (+${p.git.ahead}/-${p.git.behind})` : p.git.unpushed.length}</td></tr>`).join("")}</table></div>` : `<div class="empty">Everything is committed and pushed.</div>`) +
    `<h3>Open issues and pull requests</h3>` + (issues.length ? `<div class="tbl"><table><tr><th>Project</th><th>Type</th><th>Title</th><th>Updated</th></tr>
    ${issues.map((i) => `<tr><td>${esc(i.p.key)}</td><td>${i.t}</td><td><a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number} ${esc(i.title)}</a></td><td>${ago(i.updatedAt)}</td></tr>`).join("")}</table></div>` : `<div class="empty">No open issues or pull requests.</div>`);
}

const CMDS = Object.fromEntries(DATA.projects.filter((p) => p.cmd).map((p) => [p.key, p.cmd]));
let JOBS = {};
const live = location.protocol === "http:"; // replies need the local server (refresh.cmd)
const clock = (j) => { const s = Math.round(((j.endedAt || Date.now()) - j.startedAt) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const badge = (key) => {
  const j = JOBS[key]; if (!j) return "";
  const what = j.kind === "reply" ? "Claude" : "Checkpoint";
  return j.status === "running" ? `<span class="pill warn">&#9201; ${what} working ${clock(j)}</span>` : j.status === "waiting" ? `<span class="pill bad">&#9888; USER INPUT NEEDED</span>` : j.status === "done" ? `<span class="pill ok">&#10003; ${what} done</span>` : `<span class="pill bad">&#10007; ${what} failed</span>`;
};
// Everything in a project that is waiting on the user: a stopped headless job, and recent sessions that ended on a question.
function asking(p) {
  const j = JOBS[p.key], out = [];
  if (j && j.status === "waiting") out.push({ job: true, sessionId: j.sessionId, title: j.kind === "reply" ? "Claude replied in a session" : "Checkpoint " + (CMDS[p.key] || ""), text: j.result, at: j.endedAt && new Date(j.endedAt).toISOString(), denials: j.denials || [] });
  for (const s of p.sessions || []) {
    const last = [...s.messages].reverse().find((m) => m.role === "claude");
    // A reply sent from here after Claude's question supersedes it; the job above carries the new state.
    if (!s.asking || (j && j.sessionId === s.id && j.startedAt >= Date.parse(last?.at || s.updatedAt) - 1000)) continue;
    out.push({ sessionId: s.id, title: s.title, text: last?.text || "", at: last?.at || s.updatedAt, denials: [] });
  }
  return out;
}
const sig = (o) => Object.entries(o).map(([k, j]) => k + j.status + (j.denials?.length || 0)).join();
async function poll() {
  if (!live) return;
  try {
    const next = await (await fetch("/status", { cache: "no-store" })).json();
    const finished = Object.keys(next).some((k) => JOBS[k]?.status === "running" && next[k].status !== "running");
    const changed = sig(next) !== sig(JOBS);
    JOBS = next;
    if (finished) { setTimeout(() => location.reload(), 4000); return; } // the server is rebuilding the data
    if (!document.activeElement?.matches?.("#cards select")) cards(); // a redraw would close an open dropdown
    if (changed && tab !== "overview") { render(); return; }
    // Same state: refresh only the log and clock so a half-typed reply is not wiped.
    const log = $("#joblog"), b = $("#jobbadge");
    if (log && JOBS[tab]) { const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8; log.textContent = JOBS[tab].log; if (atEnd) log.scrollTop = log.scrollHeight; }
    if (b) b.innerHTML = badge(tab);
  } catch {}
}

// Reply boxes. Ctrl+Enter sends; the box's button says where the text goes.
let boxN = 0;
const replyBox = (attrs, placeholder, label = "Send") => { const id = "box" + ++boxN; return `<div class="tools"><textarea id="${id}" rows="2" placeholder="${esc(placeholder)} (Ctrl+Enter to send)"></textarea><button class="rbtn send" style="margin:0" data-box="${id}" ${attrs}>${label}</button></div><div class="note bad" data-msg="${id}"></div>`; };
document.addEventListener("keydown", (e) => { if (e.target.tagName === "TEXTAREA" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) e.target.closest(".tools")?.querySelector("button.send")?.click(); });
document.addEventListener("click", async (e) => {
  const opt = e.target.closest("[data-pick]");
  if (opt) { const t = document.getElementById(opt.dataset.for); t.value = (t.value ? t.value + " " : "") + opt.dataset.pick; t.focus(); return; }
  const btn = e.target.closest("button[data-send]");
  if (!btn) return;
  const box = btn.dataset.box && document.getElementById(btn.dataset.box), text = (box?.value || "").trim(), allow = btn.dataset.allow === "1";
  const say = (m) => { const n = document.querySelector(`[data-msg="${btn.dataset.box}"]`); if (n) n.textContent = m; };
  if (!allow && !text) { box?.focus(); return; }
  if (!live) { say("Replies need the local server. Double-click refresh.cmd, then reply from http://127.0.0.1:8788."); return; }
  btn.disabled = true;
  try {
    const gh = btn.dataset.send === "gh";
    if (gh && !confirm(`Post this as a GitHub comment on #${btn.dataset.number}?\n\n${text.slice(0, 400)}`)) { btn.disabled = false; return; }
    const r = await fetch((gh ? "/gh-comment/" : "/reply/") + encodeURIComponent(tab), { method: "POST",
      body: JSON.stringify(gh ? { number: Number(btn.dataset.number), text } : { text, allow, sessionId: btn.dataset.session || undefined }) });
    if (!r.ok) throw new Error(await r.text());
    if (box) box.value = "";
    if (gh) { say(""); btn.closest(".ev")?.insertAdjacentHTML("beforeend", `<div class="note ok">Posted. It shows here after the next refresh.</div>`); btn.disabled = false; }
    else { await poll(); render(); }
  } catch (err) { btn.disabled = false; say("Could not send: " + err.message); }
});
const denialText = (d) => d.tool_name + (d.tool_input?.command ? ": " + d.tool_input.command : d.tool_input?.file_path ? ": " + d.tool_input.file_path : "");

// The USER INPUT NEEDED block at the top of a project, in the format the project instructions ask for.
function needPanel(p) {
  const items = asking(p);
  if (!items.length) return "";
  return `<div class="need" role="alert"><div class="needhead">&#128680; USER INPUT NEEDED &#128680;</div>${items.map((it) => {
    const id = "box" + (boxN + 1);
    // Lettered options in the question (A:, B), C.) become quick-fill buttons; the answer is still sent by the user.
    const opts = [...new Set([...(it.text || "").matchAll(/^\s*(?:[-*]\s*)?\**\(?([A-D])[:.)]/gm)].map((m) => m[1]))];
    const rec = (it.text || "").match(/^.*\brecommend.*$/im)?.[0];
    return `<div class="needitem">
      <div><b>Action Required:</b> Claude is waiting on you in <b>${esc(it.title)}</b> <span class="meta">· ${fmt(it.at)}</span></div>
      <div class="asktext">${md(it.text)}</div>
      ${it.denials.length ? `<div><b>Claude was blocked from:</b></div><ul class="items">${it.denials.map((d) => `<li><code>${esc(denialText(d))}</code></li>`).join("")}</ul><button class="rbtn" style="margin:0 0 8px" data-send="claude" data-allow="1" data-box="${id}">Allow these and continue</button>` : ""}
      ${opts.length ? `<div class="tools"><b>Options:</b> ${opts.map((o) => `<button class="opt" data-pick="${o}" data-for="${id}">Option ${o}</button>`).join("")}</div>` : ""}
      ${rec ? `<div><b>Recommendation:</b> ${md(rec.replace(/^[\s*#>-]+/, ""))}</div>` : ""}
      ${it.sessionId ? replyBox(`data-send="claude" ${it.job ? "" : `data-session="${esc(it.sessionId)}"`}`, "Type your answer") : ""}
      <div class="note"><b>Awaiting your response before proceeding.</b></div></div>`;
  }).join("")}</div>`;
}

function jobPanel(key) {
  const j = JOBS[key];
  if (!j) return "";
  return `<div class="card" style="margin:0 0 10px"><div class="tools" style="margin:0 0 6px"><b>${j.kind === "reply" ? "Reply sent from this dashboard" : "Checkpoint run"}</b> <span id="jobbadge">${badge(key)}</span> <span class="meta">${fmt(new Date(j.startedAt).toISOString())}</span></div>
    <details ${j.status === "running" ? "open" : ""}><summary>Activity log</summary><pre id="joblog" class="joblog">${esc(j.log || "Starting...")}</pre></details>
    ${j.status !== "running" && j.status !== "waiting" && j.sessionId ? `<details><summary>Continue this conversation</summary>${replyBox(`data-send="claude"`, "Message Claude")}</details>` : ""}
  </div>`;
}
setInterval(poll, 3000); poll();

async function checkpoint(key) {
  const msg = $("#cpmsg");
  if (!confirm(`Run ${CMDS[key]} for ${key}?\n\nThis builds, deploys staging and production, then commits and pushes. It runs in the background with no window; a clock shows until it finishes.`)) return;
  try {
    const r = await fetch(SERVER + "/checkpoint/" + key, { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    if (!live) { location.href = SERVER + "/#p=" + encodeURIComponent(key); return; }
    await poll(); render();
  } catch {
    try { await navigator.clipboard.writeText(CMDS[key]); msg.textContent = "Server not running. Copied " + CMDS[key] + ". Paste it into Claude Code in that project."; }
    catch { msg.textContent = "Server not running. Run " + CMDS[key] + " in Claude Code in that project."; }
  }
}

// Claude column: the dashboard's own run for this project, then the newest Claude Code sessions in its folder.
function claudeCol(p) {
  const who = { user: "You", claude: "Claude", tool: "" };
  const waits = new Set(asking(p).filter((x) => !x.job).map((x) => x.sessionId));
  const sessions = (p.sessions || []).map((s, i) => `<details class="sess card" style="margin:0 0 8px" ${i === 0 || waits.has(s.id) ? "open" : ""}>
      <summary>${esc(s.title)} ${waits.has(s.id) ? `<span class="pill bad">Needs input</span>` : ""}<div class="meta">${fmt(s.updatedAt)} · ${s.total} messages${s.total > s.messages.length ? `, newest ${s.messages.length} shown` : ""}</div></summary>
      ${s.messages.map((m) => m.role === "tool" ? `<div class="msg tool">&#8250; ${esc(m.text)}</div>` : `<div class="msg ${m.role}"><div class="meta">${who[m.role]} · ${fmt(m.at)}</div><div class="txt">${md(m.text)}</div></div>`).join("")}
      ${waits.has(s.id) ? `<div class="note warn">Claude is waiting on you. Answer in the USER INPUT NEEDED box above.</div>` : `<details><summary>Reply to this session</summary>${replyBox(`data-send="claude" data-session="${esc(s.id)}"`, "Message Claude")}<div class="note">Sends with <code>claude --resume</code> in the background. Avoid this while the same session is open in a terminal.</div></details>`}
    </details>`).join("");
  return jobPanel(p.key) + (sessions || `<div class="empty">No Claude Code sessions found for <code>${esc(p.dir)}</code>.</div>`);
}

// GitHub column: one newest-first timeline of issues, PRs, comments, commits and Actions runs.
const GH_TYPES = { all: "All", talk: "Issues & PRs", comment: "Comments", commit: "Commits", run: "Actions" };
function ghCol(p) {
  const r = p.remote;
  if (!r.url) return `<div class="empty">No GitHub repo for this project.</div>`;
  const list = (r.activity || []).filter((i) => ghFilter === "all" || i.type === ghFilter || (ghFilter === "talk" && (i.type === "issue" || i.type === "pr")));
  const stateCls = (s) => /fail|cancel|timed|startup/.test(s) ? "bad" : /success|merged|closed|completed/.test(s) ? "ok" : "warn";
  const label = (i) => i.type === "issue" ? `Issue #${i.number}` : i.type === "pr" ? `PR #${i.number}` : i.type === "comment" ? "Comment" : i.type === "commit" ? `Commit ${esc(i.sha)}` : "Action";
  return list.map((i) => `<div class="ev">
      <span class="pill">${label(i)}</span> <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> ${i.state ? `<span class="pill ${stateCls(i.state)}">${esc(i.state)}</span>` : ""}
      <div class="meta">${esc(i.author || "")} · ${fmt(i.at)}${i.created && i.created !== i.at ? " · opened " + fmt(i.created) : ""}</div>
      ${i.body ? `<details ${i.type === "comment" ? "open" : ""}><summary>Message</summary><div class="asktext">${md(i.body)}</div></details>` : ""}
      ${i.number && (i.type !== "issue" && i.type !== "pr" || i.state !== "closed") ? `<details><summary>Reply on GitHub</summary>${replyBox(`data-send="gh" data-number="${i.number}"`, `Comment on #${i.number}`, "Post comment")}</details>` : ""}
    </div>`).join("") || `<div class="empty">No GitHub activity${ghFilter === "all" ? "" : " of this kind"}.</div>`;
}

function fullView(p) {
  const [label, cls] = status(p), job = JOBS[p.key], busy = job?.status === "running" || job?.status === "waiting";
  return `<div class="fbar">
      <div class="grow"><h2 id="ftitle">${esc(p.key)} <span class="pill ${cls}">${label}</span> <span id="jobbadge">${badge(p.key)}</span></h2><div class="sub">${esc(p.name)} · <code>${esc(p.dir)}</code>${p.remote.url ? ` · <a href="${p.remote.url}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
      ${CMDS[p.key] && !busy ? `<button class="rbtn" style="margin:0" data-act="checkpoint">Checkpoint</button>` : ""}<span class="sub" id="cpmsg"></span>
      <div class="seg" role="group" aria-label="View"><button data-view="messages" aria-pressed="${view === "messages"}">Messages</button><button data-view="details" aria-pressed="${view === "details"}">Details</button></div>
      <button class="ibtn" data-act="fs" title="Browser full screen">${document.fullscreenElement ? "Exit full screen" : "Full screen"}</button>
      <button class="ibtn" data-act="close" title="Close (Esc)">&#10005; Close</button>
    </div>
    ${needPanel(p)}
    <div class="fbody">${view === "details" ? projectView(p) : `<div class="cols">
      <section class="col" aria-label="Claude messages"><h3>Claude messages <span class="note">${(p.sessions || []).length} recent sessions</span></h3><div class="colbody">${claudeCol(p)}</div></section>
      <section class="col" aria-label="GitHub messages"><h3>GitHub messages <span class="filters">${Object.entries(GH_TYPES).map(([k, n]) => `<button data-gh="${k}" aria-pressed="${ghFilter === k}">${n}</button>`).join("")}</span></h3><div class="colbody">${ghCol(p)}</div></section>
    </div>`}</div>`;
}
$("#full").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-view],[data-gh]");
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; render(); }
  else if (t.dataset.gh) { ghFilter = t.dataset.gh; render(); }
  else if (t.dataset.act === "close") closeProject();
  else if (t.dataset.act === "checkpoint") checkpoint(tab);
  else if (t.dataset.act === "fs") (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}).finally(render);
});
document.addEventListener("fullscreenchange", () => { if (tab !== "overview") render(); });

function projectView(p) {
  if (p.error) return `<div class="empty bad">${esc(p.error)}</div>`;
  const g = p.git, r = p.remote;
  const sync =!g.upstream ? "No upstream branch" : `${g.ahead} ahead / ${g.behind} behind ${esc(g.upstream)}`;
  return `<div class="sub"><code>${esc(p.dir)}</code> · ${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">GitHub</a>` : "No GitHub repo"} · ${sync}${g.stashes ? " · " + g.stashes + " stash(es)" : ""}</div>
  <div class="sub">Last commit <code>${esc(g.last.hash)}</code> ${esc(g.last.subject)} (${ago(g.last.date)})</div>
  <h3>Items to commit (${g.files.length})</h3>
  ${g.files.length ? `<div class="tbl"><table><tr><th>State</th><th>Path</th></tr>${g.files.map((f) => `<tr><td><span class="pill ${f.kind === "conflict" ? "bad" : "warn"}">${f.kind}</span></td><td class="path">${esc(f.path)}</td></tr>`).join("")}</table></div>` : `<div class="empty">Working tree is clean.</div>`}
  ${g.unpushed.length ? `<h3>Commits not pushed (${g.unpushed.length})</h3>${diverged(p) ? `<div class="sub warn">Local and remote have diverged (${g.ahead} ahead, ${g.behind} behind). These may already be merged on GitHub under different hashes.</div>` : ""}<ul class="items">${g.unpushed.map((c) => `<li><code>${esc(c.slice(0, 7))}</code> ${esc(c.slice(8))}</li>`).join("")}</ul>` : ""}
  <h3>Outstanding issues</h3>
  ${r.issues.map((i) => `<details><summary><a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number}</a> ${esc(i.title)} <span class="sub">· ${ago(i.updatedAt)}</span></summary><pre>${esc(i.body)}</pre></details>`).join("") || `<div class="empty">No open issues.</div>`}
  ${r.prs.length ? `<h3>Open pull requests</h3><ul class="items">${r.prs.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> ${esc(x.title)}${x.isDraft ? " (draft)" : ""}</li>`).join("")}</ul>` : ""}
  <h3>Status notes (PROJECT_STATUS.md)</h3>
  ${p.doc ? `<div class="sub">${esc(p.doc.headline)}</div>${p.doc.open.length ? `<ul class="items">${p.doc.open.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${p.doc.totalOpen > p.doc.open.length ? `<div class="sub">Showing ${p.doc.open.length} of ${p.doc.totalOpen}. See PROJECT_STATUS.md.</div>` : ""}` : `<div class="empty">No "still open" list in the newest entry.</div>`}` : `<div class="empty">No PROJECT_STATUS.md found.</div>`}`;
}

// Re-rendering keeps what the user has typed and where each pane was scrolled.
function render() {
  $("#detail").innerHTML = overview();
  const p = DATA.projects.find((x) => x.key === tab), full = $("#full");
  document.body.classList.toggle("locked", !!p);
  full.hidden = !p;
  if (!p) { full.innerHTML = ""; return; }
  const typed = [...full.querySelectorAll("textarea")].map((t) => t.value), scroll = [...full.querySelectorAll(".colbody,.fbody,.need")].map((el) => el.scrollTop);
  const focus = document.activeElement?.tagName === "TEXTAREA" ? [...full.querySelectorAll("textarea")].indexOf(document.activeElement) : -1;
  boxN = 0;
  full.innerHTML = fullView(p);
  full.querySelectorAll("textarea").forEach((t, i) => { if (typed[i]) { t.value = typed[i]; t.closest("details")?.setAttribute("open", ""); } });
  full.querySelectorAll(".colbody,.fbody,.need").forEach((el, i) => { if (scroll[i]) el.scrollTop = scroll[i]; });
  if (focus >= 0) full.querySelectorAll("textarea")[focus]?.focus();
}
cards(); tabs(); render();
</script>
</body>
</html>
