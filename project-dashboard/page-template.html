<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BWE Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--mute:#5d6672;--line:#e1e5ea;--ok:#157347;--warn:#b26a00;--bad:#b3261e;--accent:#1a56db;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#98a2ae;--line:#2a3039;--ok:#4cc38a;--warn:#e0a03a;--bad:#f2766d;--accent:#7aa2ff;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 8px;max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
main{max-width:1500px;margin:0 auto;padding:8px 16px 48px}
.top{display:flex;gap:14px;align-items:flex-start;margin:12px 0 20px}.top .grid{flex:1;min-width:0;margin:0}.top #plan{flex:0 0 400px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}.top #plan .plan{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
#cards.grid{grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:700px){#cards.grid{grid-template-columns:1fr}}
.grid .card{padding:9px 11px}.grid .card .sub{font-size:12px}.grid .big{font-size:17px}.grid .card{overflow-wrap:break-word}.grid .card h2{overflow-wrap:anywhere;font-size:15px}.grid .row{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:6px}.grid .row b{display:inline;margin-right:5px}.grid .row small{display:inline;white-space:nowrap}.grid .row b{font-size:15px}.grid .row small{font-size:11px}.grid .row div{min-width:0}.grid .gitsel{padding:3px 6px;font-size:13px}
@media (max-width:1000px){.top{flex-direction:column}.top #plan{flex:none;width:100%;position:static;max-height:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:16px;margin:0 0 2px}
.big{font-size:24px;font-weight:650;line-height:1.2}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.row div{min-width:64px}.row small{display:block;color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
h3{font-size:15px;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;background:var(--chip)}
tr:last-child td{border-bottom:0}

a{color:var(--accent)}
.rbtn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 14px;border-radius:8px;cursor:pointer;margin-left:8px}
.ask{border-left:4px solid var(--warn);background:var(--chip);border-radius:8px;padding:10px 12px;margin-bottom:10px}

.joblog{max-height:320px;overflow:auto;background:var(--chip);border-radius:8px;padding:10px;margin:0 0 10px}
textarea{flex:1;min-width:220px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}

.ibtn:disabled{opacity:.45;cursor:not-allowed}
.gitsel{width:100%;min-width:0;max-width:100%;font:inherit;padding:5px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.jump{cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px}.jump:hover{background:var(--chip)}.jump:hover small{text-decoration:underline}
.flash{animation:flash 1.5s}@keyframes flash{from{background:color-mix(in srgb,var(--warn) 35%,transparent)}to{background:transparent}}
.gitsel:disabled{opacity:.6;cursor:wait}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Consolas,monospace;margin:8px 0 2px}
ul.items{margin:6px 0;padding-left:20px}ul.items li{margin:3px 0}
code{font:13px ui-monospace,Consolas,monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
.empty{color:var(--mute);padding:18px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.tbl{overflow-x:auto}
.card.pick{cursor:pointer}.card.pick:hover,.card.pick:focus-visible{border-color:var(--accent);outline:none}
body.locked{overflow:hidden}
.full{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column}
.full[hidden]{display:none}
.fbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}

.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.ibtn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:8px;cursor:pointer}
.fbody{flex:1;min-height:0;overflow:auto;padding:12px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.col>h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colbody{flex:1;min-height:0;overflow:auto;padding:10px 14px}
@media (max-width:900px){.cols{grid-template-columns:1fr;height:auto}.colbody{overflow:visible}}
.need{border:2px solid var(--bad);border-radius:10px;background:var(--card);margin:12px 16px 0;padding:10px 14px;max-height:45vh;overflow:auto}
.needhead{font-size:20px;font-weight:800;letter-spacing:.03em;color:var(--bad);text-transform:uppercase}
.needitem{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px}
.needitem:first-of-type{border-top:0;margin-top:0}
.msg{margin:8px 0;padding:8px 11px;border-radius:10px;max-width:92%;background:var(--chip)}
.msg.user{margin-left:auto;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.msg.tool{background:none;padding:1px 11px;margin:2px 0;font:12px/1.45 ui-monospace,Consolas,monospace;color:var(--mute);word-break:break-all}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.meta{font-size:12px;color:var(--mute)}
.sess{padding:6px 12px}
.sess>summary{font-weight:600}
.ev{border-bottom:1px solid var(--line);padding:8px 0}
.ev:last-child{border-bottom:0}
.ev details{border:0;padding:0;margin:4px 0 0;background:none}
.ev summary{font-weight:400;font-size:13px;color:var(--mute)}
.filters{display:inline-flex;gap:4px;flex-wrap:wrap;font-weight:400}
.filters button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:2px 9px;border-radius:99px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--mute)}
.focus{max-width:900px;margin:0 auto}
.fitem{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.ftitle{font-weight:650;font-size:16px}.fabout{margin:6px 0;white-space:pre-wrap;word-break:break-word;color:var(--mute)}
.fnext{margin-top:6px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--chip);border-radius:6px}
.working{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--accent);border-radius:10px;background:var(--card);margin:12px 16px 0;padding:12px 14px}
.spin{flex:none;width:18px;height:18px;margin-top:2px;border:3px solid var(--chip);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin.sm{display:inline-block;vertical-align:-2px;width:11px;height:11px;margin:0 2px 0 0;border-width:2px}
.attn{margin:12px 16px 0;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
#groups{margin:6px 0 4px}#groups button{font-size:16px;padding:8px 22px}#groups .gn{margin-left:8px;font-size:12px;padding:0 7px;border-radius:99px;background:var(--chip);color:var(--ink)}#groups button[aria-pressed=true] .gn{background:#fff3;color:#fff}
.spark{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:10px}.spark i{flex:1;min-width:4px;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0}
.stools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.stools input,.stools select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.stools input{flex:1;min-width:200px}
td.url{word-break:break-all}.tbl{overflow-x:auto}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:0 0 20px}.lists .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.lists h3{margin:0 0 6px;font-size:15px}.lists ul{list-style:none;margin:0;padding:0}.lists li{padding:5px 0;border-top:1px solid var(--line);font-size:14px}.lists li:first-child{border-top:0}.lists .k{font-weight:600;cursor:pointer}
.plan{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.plan ol{margin:8px 0 0;padding-left:22px}.plan li{margin:6px 0}.plan li label{cursor:pointer}.plan li .meta{margin-left:6px}.plan li .ibtn{margin-left:8px;padding:2px 10px;font-size:13px}
.plan li.done label{text-decoration:line-through;color:var(--mute)}.plan input{margin:0 6px 0 0;vertical-align:-2px}
.attn ul{margin:6px 0 0;padding:0;list-style:none}.attn li{margin:4px 0}.attn li .meta{margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>BWE Dashboard</h1>
  <div class="sub" id="gen"></div>
</header>
<main>
  <nav id="groups" aria-label="Dashboard sections"></nav>
  <div id="gProjects">
  <div class="top"><div class="grid" id="cards"></div><section id="plan" aria-label="Recommended actions"></section></div>
  <nav id="tabs"></nav>
  <section id="detail"></section>
  <section id="lists"></section>
  </div>
  <div id="gGoogle" hidden>
    <div class="grid" id="scards"></div>
    <nav id="stabs"></nav>
    <section id="sdetail"></section>
  </div>
</main>
<div id="full" class="full" role="dialog" aria-modal="true" aria-labelledby="ftitle" hidden></div>
<script>
window.addEventListener("error", (e) => {
  const d = document.querySelector("#detail") || document.body;
  d.insertAdjacentHTML("afterbegin", `<div class="empty bad">Something on this page broke: ${String(e.message).replace(/</g, "&lt;")} (line ${e.lineno}).<br><b>What to do:</b> click Refresh now. If it keeps happening, send a screenshot of this message to Claude.</div>`);
});
const DATA = /*__DATA__*/null;
if (!DATA) throw new Error("This is the blank page-template.html, not the dashboard. Run refresh.cmd.");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (iso) => { if (!iso) return "never"; const h = (Date.now() - Date.parse(iso)) / 36e5; return h < 1 ? "just now" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago"; };
// Browser-local time, 12-hour clock.
const fmt = (iso) => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }) : "-";
const md = (s) => esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/`([^`\n]+)`/g, "<code>$1</code>");
// The open project is kept in the address (#p=KEY) so a reload comes back to it.
let tab = (() => { const k = decodeURIComponent((location.hash.match(/^#p=(.+)$/) || [])[1] || ""); return DATA.projects.some((p) => p.key === k) ? k : "overview"; })();
// The dashboard's sections: the project groups (Websites, Utilities) and Google (the search monitor).
const GROUPS = [["websites", "Websites"], ["utilities", "Utilities"], ["google", "Google"]];
const GROUP_KEY = "projdash-group";
let group = (() => { const k = tab !== "overview" && DATA.projects.find((p) => p.key === tab)?.group; if (k) return k; try { const g = localStorage.getItem(GROUP_KEY); return GROUPS.some(([x]) => x === g) ? g : "websites"; } catch { return "websites"; } })();
const inGroup = () => DATA.projects.filter((p) => p.group === group);
const groupOf = (key) => DATA.projects.find((p) => p.key === key)?.group;
let view = "messages", ghFilter = "attention", showTools = false;

const SERVER = "http://127.0.0.1:8788";
const AUTO_KEY = "projdash-auto";
const getAuto = () => { try { return localStorage.getItem(AUTO_KEY) || "0"; } catch { return "0"; } };
$("#gen").innerHTML = `<span id="stamp"></span> <select id="auto" aria-label="Auto refresh"><option value="0">Auto-refresh off</option><option value="5">Every 5 min</option><option value="15">Every 15 min</option><option value="60">Every hour</option></select><button id="refresh" class="rbtn">Refresh now</button>`;
const stamp = (t) => { $("#stamp").textContent = t; };
const pulled = () => DATA.generatedAt ? "Data pulled " + fmt(DATA.generatedAt) + " (" + ago(DATA.generatedAt) + ")." : "Loading project data...";
stamp(pulled());
const offline = "The dashboard server isn't running, so the data can't be updated.\nWhat to do: double-click refresh.cmd (or update.cmd) in the project-dashboard folder, then try again.";
// Refresh asks the server to collect again and returns at once with the run that will hold the new data;
// watchBuild() then fills in each project as it arrives.
async function refresh() {
  if (location.protocol !== "http:") { location.href = SERVER; return; } // a file copy moves to the live page
  const b = $("#refresh");
  b.disabled = true; b.textContent = "Refreshing...";
  try {
    const r = await fetch("/refresh", { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    const { run } = await r.json();
    watchBuild();
    return run;
  } catch (err) {
    b.disabled = false; b.textContent = "Refresh now";
    // "Failed to fetch" means nothing answered at all: the dashboard server has stopped, not that a refresh went wrong.
    stamp(/failed to fetch|networkerror/i.test(err.message) ? offline : /What to do:/.test(err.message) ? err.message : "Refresh failed: " + err.message + "\nWhat to do: click Refresh now again; if it keeps failing, send a screenshot to Claude.");
  }
}
// Refresh now also clears the checked-off actions (ticked by you, or fixed); the list is then rebuilt from the new data,
// so a ticked item that is still a problem comes back unticked.
$("#refresh").onclick = () => { for (const it of Object.values(plan)) if (!it.open || it.ticked) delete plan[it.id]; savePlan(); drawPlan(); refresh(); };
$("#auto").value = getAuto();
$("#auto").onchange = (e) => { try { localStorage.setItem(AUTO_KEY, e.target.value); } catch {} scheduleAuto(); };
let autoT = 0;
function scheduleAuto() { clearTimeout(autoT); if (getAuto() !== "0" && location.protocol === "http:") autoT = setTimeout(refresh, Number(getAuto()) * 60000); }

// Progressive loading: the server collects a few projects at a time and hands each over as soon as it is ready.
// Each one replaces its card straight away; the action plan is worked out once every project is in.
let SEQ = 0, RUN = 0, building = false, doneCount = 0, watching = null;
const fresh = new Set(), waiters = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Resolves once the project has data from the given run (or the update stops), so a Git action can finish its clock.
const waitFor = (key, run) => new Promise((resolve) => waiters.push({ key, run, resolve }));
function redraw(keys) {
  if (!document.activeElement?.matches?.("#cards select")) cards(); // a redraw would close an open dropdown
  $("#detail").innerHTML = overview();
  drawPlan(); drawLists(); groupsNav();
  if (tab !== "overview" && keys.includes(tab)) render();
}
function watchBuild() {
  if (!live) return Promise.resolve();
  return (watching ||= (async () => {
    for (;;) {
      let pr;
      try { pr = await (await fetch("/progress?since=" + SEQ, { cache: "no-store" })).json(); }
      catch { stamp(offline); break; }
      if (pr.run !== RUN) { RUN = pr.run; fresh.clear(); }
      const keys = [];
      for (const np of pr.projects) {
        SEQ = Math.max(SEQ, np.seq); keys.push(np.key);
        const i = DATA.projects.findIndex((p) => p.key === np.key);
        if (i >= 0) DATA.projects[i] = np; else DATA.projects.push(np);
        if (np.run === pr.run) fresh.add(np.key);
        for (const w of waiters.filter((w) => w.key === np.key && np.run >= w.run)) { waiters.splice(waiters.indexOf(w), 1); w.resolve(); }
      }
      if (pr.search) { DATA.search = pr.search; sRender(); groupsNav(); }
      building = pr.running || pr.queued; doneCount = pr.done;
      if (building) { stamp(`Updating... ${pr.done} of ${pr.total} projects loaded.`); if (keys.length || !planReady) redraw(keys); await sleep(1000); continue; }
      if (pr.generatedAt) DATA.generatedAt = pr.generatedAt;
      stamp(pr.error || pulled());
      fresh.clear(); updatePlan(); redraw(keys);
      break;
    }
    building = false; watching = null;
    waiters.splice(0).forEach((w) => w.resolve());
    const b = $("#refresh"); b.disabled = false; b.textContent = "Refresh now";
    scheduleAuto();
  })());
}

// Outstanding = open GitHub issues + open PRs + the newest "still open" list from PROJECT_STATUS.md.
// Ahead AND behind means local and remote have split (often squash-merged PRs), so "unpushed" is not a real count.
const diverged = (p) => !!(p.git && p.git.ahead && p.git.behind);
const counts = (p) => ({
  uncommitted: p.git?.files.length ?? 0,
  unpushed: p.git?.unpushed.length ?? 0,
  issues: p.remote.issues.length,
  prs: p.remote.prs.length,
  todo: p.doc?.totalOpen ?? 0,
});
// Why a project's folder couldn't be read, and what to do about it.
const folderProblem = (p) => /cannot change to|no such file/i.test(p.error) ? [`The folder ${p.dir} wasn't found.`, "Check the drive is connected and the folder exists, or correct its path in projects.mjs."]
  : /not a git repository/i.test(p.error) ? [`${p.dir} isn't a git repository.`, "Correct the path in projects.mjs, or ask Claude to set the folder up with git."]
  : ["Git couldn't read this project's folder.", "Click Refresh now. If it keeps failing, send a screenshot of this card to Claude."];
function status(p) {
  if (p.loading) return ["Loading...", ""];
  if (p.error) return ["Git error", "bad"];
  const c = counts(p);
  if (diverged(p)) return c.uncommitted ? ["Needs commit", "warn"] : ["Diverged", "warn"];
  if (c.uncommitted || c.unpushed) return ["Needs commit", "warn"];
  if (p.git.behind) return ["Behind remote", "warn"];
  if (openFailures(p).length) return ["Action failed", "bad"]; // a GitHub Actions workflow whose newest run failed
  if (c.issues || c.prs) return ["Open items", "warn"];
  return ["Clean", "ok"];
}

function cards() {
  $("#cards").innerHTML = inGroup().map((p) => {
    const [label, cls] = status(p), c = counts(p);
    if (p.loading) return `<div class="card pick" tabindex="0" role="button" data-open="${esc(p.key)}" aria-label="Open ${esc(p.key)} full screen"><h2>${esc(p.key)}</h2><div class="sub">${esc(p.name)}</div><div class="big"><span class="spin sm" aria-hidden="true"></span> Loading...</div><div class="sub">Collecting git, GitHub and Claude data for this project.</div></div>`;
    const upd = building && !fresh.has(p.key) ? `<span class="pill"><span class="spin sm" aria-hidden="true"></span> Updating</span>` : "";
    const waiting = asking(p).length && JOBS[p.key]?.status !== "running";
    // A question waiting for the user outranks a "done" badge; it comes with a button that opens the answer box.
    const b = [upd, waiting ? `<span class="pill bad">&#9888; USER INPUT NEEDED</span>` : badge(p.key)].filter(Boolean).join(" ");
    return `<div class="card pick" tabindex="0" role="button" data-open="${esc(p.key)}" aria-label="Open ${esc(p.key)} full screen"><h2>${esc(p.key)}</h2><div class="sub">${esc(p.name)}</div>
      <div class="big ${cls}">${label}</div>${b ? `<div>${b}</div>` : ""}
      <div class="sub">${p.git ? esc(p.git.branch) + " · last commit " + ago(p.git.last.date) : `${esc(folderProblem(p)[0])} <b>What to do:</b> ${esc(folderProblem(p)[1])}`}</div>

// A Git dropdown on every card: Commit, Push, Commit & push, Pull, and Fix diverged (pull, then push).
// A choice with nothing to do is greyed out with the reason.

const gitBusy = {}, gitNote = {};

  const opt = (act, label, why) => `<option value="${act}" ${why ? "disabled" : ""}>${label}${why ? ` (${esc(why)})` : ""}</option>`;
  const note = gitNote[p.key];

    <option value="">Git...</option>
    ${opt("commit", "Commit", c.uncommitted ? "" : "none")}
    ${opt("push", "Push", pushBlock || (c.unpushed ? "" : "none"))}
    ${opt("both", "Commit &amp; push", pushBlock || (c.uncommitted ? "" : "none"))}
    ${opt("pull", "Pull", !p.git.upstream ? "no remote" : !p.git.behind ? "up to date" : c.uncommitted ? "commit first" : "")}
    ${opt("sync", "Fix diverged", !p.git.upstream ? "no remote" : !(p.git.behind && p.git.ahead) ? "not diverged" : c.uncommitted ? "commit first" : "")}
  </select></div>${note?.text ? `<div class="note ${note.bad ? "bad" : ""}" style="white-space:pre-wrap">${esc(note.text)}</div>` : ""}`;
}
async function gitAction(key, act) {
  const p = DATA.projects.find((x) => x.key === key), g = p.git;
  const say = (text, bad) => { gitNote[p.key] = { text, bad }; if (!document.activeElement?.matches?.("#cards select")) cards(); };
  say(""); // a new choice clears the last result
  const files = g.files.map((f) => `${f.kind}: ${f.path}`), list = (a) => a.slice(0, 15).join("\n") + (a.length > 15 ? `\n...and ${a.length - 15} more` : "");
  let message = "";
  if (act === "commit" || act === "both") {
    message = prompt(`${act === "both" ? "Commit and push" : "Commit"} all ${files.length} changed file(s) in ${p.key} on ${g.branch}:\n\n${list(files)}\n\nCommit message:`, `Update ${files.length} file${files.length > 1 ? "s" : ""}`);
    if (message === null) return;
    if (!message.trim()) { say("The commit message was empty, so nothing was committed.\nWhat to do: pick the option again and type a short message describing the change.", true); return; }
  } else if (act === "push" && !confirm(`Push ${g.unpushed.length} commit(s) on ${g.branch} to ${g.upstream || "origin"} for ${p.key}?\n\n${list(g.unpushed)}`)) return;
  else if (act === "pull" && !confirm(`Pull ${g.behind} commit(s) from ${g.upstream} into ${p.key}?${g.ahead ? `\n\nYour ${g.ahead} local commit(s) are replayed on top.` : ""}`)) return;

  if (location.protocol !== "http:") { say("This page was opened as a file, so it can't run git.\nWhat to do: double-click refresh.cmd and use the page it opens (http://127.0.0.1:8788).", true); return; }
  // A running clock shows from the press until the page reloads, for the git step and then the dashboard rebuild.
  const t0 = Date.now();
  let step = { commit: "Committing", push: "Pushing", both: "Committing and pushing", pull: "Pulling", sync: "Fixing diverged: pulling, then pushing" }[act];
  const tick = () => { const s = Math.floor((Date.now() - t0) / 1000); say(`\u23F1 ${step}... ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`); };

    const r = await fetch("/git/" + encodeURIComponent(p.key), { method: "POST", body: JSON.stringify({ action: act, message }) });
    if (!r.ok) throw new Error(await r.text());
    step = "Done. Updating this card"; tick();
    const run = await refresh();
    if (run) await waitFor(p.key, run);
    clearInterval(timer); gitBusy[p.key] = false;
    say("\u2713 " + { commit: "Committed", push: "Pushed", both: "Committed and pushed", pull: "Pulled", sync: "Fixed: pulled, then pushed" }[act] + ". The card shows the new state.");
  } catch (err) { clearInterval(timer); gitBusy[p.key] = false; say(/What to do:/.test(err.message) ? err.message : /failed to fetch|networkerror/i.test(err.message) ? "The dashboard server isn't running, so nothing was done.\nWhat to do: double-click refresh.cmd in the project-dashboard folder, then try again." : err.message + "\nWhat to do: click Refresh now and try again. If it keeps failing, send a screenshot of this message to Claude.", true); }
}

const CMDS = Object.fromEntries(DATA.projects.filter((p) => p.cmd).map((p) => [p.key, p.cmd]));
let JOBS = {};
const live = location.protocol === "http:"; // replies need the local server (refresh.cmd)
const clock = (j) => { const s = Math.round(((j.endedAt || Date.now()) - (j.lastStart || j.startedAt)) / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const badge = (key) => {

  return j.status === "running" ? `<span class="pill warn"><span class="spin sm" aria-hidden="true"></span> Claude is working ${clock(j)}</span>` : j.status === "waiting" ? `<span class="pill bad">&#9888; USER INPUT NEEDED</span>` : j.status === "done" ? `<span class="pill ok">&#10003; ${what} done</span>` : `<span class="pill bad">&#10007; ${what} failed</span>`;

// Everything in a project that is waiting on the user: a stopped headless job, and recent sessions that ended on a question.
function asking(p) {

  for (const s of p.sessions || []) {

    // A reply sent from here after Claude's question supersedes it; the job above carries the new state.
    const repliedAt = j?.answered?.[s.id] || (j && j.sessionId === s.id ? j.startedAt : 0);
    if (!s.asking || repliedAt >= Date.parse(last?.at || s.updatedAt) - 1000) continue;

const sig = (o) => Object.entries(o).map(([k, j]) => k + j.status + (j.denials?.length || 0)).join();

    const changed = sig(next) !== sig(JOBS);

    if (b) b.innerHTML = badge(tab);

// Reply boxes. Ctrl+Enter sends; the box's button says where the text goes.
let boxN = 0;
const replyBox = (attrs, placeholder, label = "Send") => { const id = "box" + ++boxN; return `<div class="tools"><textarea id="${id}" rows="2" placeholder="${esc(placeholder)} (Ctrl+Enter to send)"></textarea><button class="rbtn send" style="margin:0" data-box="${id}" ${attrs}>${label}</button></div><div class="note bad" style="white-space:pre-wrap" data-msg="${id}"></div>`; };
document.addEventListener("keydown", (e) => { if (e.target.tagName === "TEXTAREA" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) e.target.closest(".tools")?.querySelector("button.send")?.click(); });
document.addEventListener("click", async (e) => {
  const opt = e.target.closest("[data-pick]");
  if (opt) { const t = document.getElementById(opt.dataset.for); t.value = (t.value ? t.value + " " : "") + opt.dataset.pick; t.focus(); return; }

  if (!allow && !text) { box?.focus(); return; }
  if (!live) { say("This page was opened as a file, so it can't send replies.\nWhat to do: double-click refresh.cmd and reply from the page it opens (http://127.0.0.1:8788)."); return; }
  btn.disabled = true;
  try {

    const r = await fetch((gh ? "/gh-comment/" : "/reply/") + encodeURIComponent(tab), { method: "POST",
      body: JSON.stringify(gh ? { number: Number(btn.dataset.number), text } : { text, allow, sessionId: btn.dataset.session || undefined }) });

});
const denialText = (d) => d.tool_name + (d.tool_input?.command ? ": " + d.tool_input.command : d.tool_input?.file_path ? ": " + d.tool_input.file_path : "");

// The USER INPUT NEEDED block at the top of a project, in the format the project instructions ask for.

// Plain-English summaries of Claude's questions, written by the server and fetched once per message.
const SUMS = {};

const sumHtml = (t) => { const s = SUMS[sumKey(t)]; return !s || s.status === "working" ? `<span class="spin sm" aria-hidden="true"></span> <span class="meta">Writing a plain summary...</span>` : s.status === "failed" ? esc(s.text) : esc(s.text).replace(/^(What happened:|What Claude needs from you:|Your choices:|Recommended:)/gm, "<b>$1</b>"); };

    sumBusy.add(k);
    for (let n = 0; n < 90; n++) {
      try {
        const r = await fetch("/summary", { method: "POST", body: JSON.stringify({ text: it.text }) });

    const opts = [...new Set([...(it.text || "").matchAll(/^\s*(?:[-*]\s*)?\**\(?([A-D])[:.)]/gm)].map((m) => m[1]))];
    const rec = (it.text || "").match(/^.*\brecommend.*$/im)?.[0];
    return `<div class="needitem">
      <div><b>Action Required:</b> Claude is waiting on you in <b>${esc(it.title)}</b> <span class="meta">· ${fmt(it.at)}</span></div>
      <div class="plain" data-sum="${sumKey(it.text)}">${sumHtml(it.text)}</div>
      <div class="meta">Claude's original message:</div>
      ${it.text.length > 600 ? `<div class="asktext">${md("…" + it.text.slice(-600))}</div><details><summary>Show the whole message</summary><div class="asktext">${md(it.text)}</div></details>` : `<div class="asktext">${md(it.text)}</div>`}
      ${it.denials.length ? `<div><b>Claude was blocked from:</b></div><ul class="items">${it.denials.map((d) => `<li><code>${esc(denialText(d))}</code></li>`).join("")}</ul><button class="rbtn" style="margin:0 0 8px" data-send="claude" data-allow="1" data-box="${id}">Allow these and continue</button>` : ""}
      ${opts.length ? `<div class="tools"><b>Options:</b> ${opts.map((o) => `<button class="opt" data-pick="${o}" data-for="${id}">Option ${o}</button>`).join("")}</div>` : ""}
      ${rec ? `<div><b>Recommendation:</b> ${md(rec.replace(/^[\s*#>-]+/, ""))}</div>` : ""}
      ${it.sessionId ? replyBox(`data-send="claude" ${it.job ? "" : `data-session="${esc(it.sessionId)}"`}`, "Type your answer") : ""}
      <div class="note"><b>Awaiting your response before proceeding.</b></div></div>`;
  }).join("")}</div>`;
}

function jobPanel(key) {
  const j = JOBS[key];
  if (!j) return "";
  return `<div class="card" style="margin:0 0 10px"><div class="tools" style="margin:0 0 6px"><b>${j.kind === "reply" ? "Reply sent from this dashboard" : "Checkpoint run"}</b> <span id="jobbadge">${badge(key)}</span> <span class="meta">${fmt(new Date(j.startedAt).toISOString())}</span></div>
    <details><summary>Activity log</summary><pre ${j.status === "running" ? "" : `id="joblog"`} class="joblog">${esc(j.log || "Starting...")}</pre></details>
    ${j.status !== "running" && j.status !== "waiting" && j.sessionId ? `<details><summary>Continue this conversation</summary>${replyBox(`data-send="claude"`, "Message Claude")}</details>` : ""}
  </div>`;
}
setInterval(poll, 3000); poll();

async function checkpoint(key) {
  const msg = $("#cpmsg");
  if (!confirm(`Run ${CMDS[key]} for ${key}?\n\nThis builds, deploys staging and production, then commits and pushes. It runs in the background with no window; a clock shows until it finishes.`)) return;
  try {
    const r = await fetch(SERVER + "/checkpoint/" + key, { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    if (!live) { location.href = SERVER + "/#p=" + encodeURIComponent(key); return; }
    await poll(); render();
  } catch {
    try { await navigator.clipboard.writeText(CMDS[key]); msg.textContent = "The dashboard server isn't running, so the checkpoint didn't start. What to do: double-click refresh.cmd, or paste " + CMDS[key] + " (now copied) into Claude Code in that project."; }
    catch { msg.textContent = "The dashboard server isn't running, so the checkpoint didn't start. What to do: double-click refresh.cmd, or run " + CMDS[key] + " in Claude Code in that project."; }
  }
}

// Claude column: the dashboard's own run for this project, then the newest Claude Code sessions in its folder.
function claudeCol(p) {
  const who = { user: "You", claude: "Claude", tool: "" };
  const waits = new Set(asking(p).filter((x) => !x.job).map((x) => x.sessionId));
  const sessions = (p.sessions || []).map((s, i) => `<details class="sess card" style="margin:0 0 8px" ${i === 0 || waits.has(s.id) ? "open" : ""}>
      <summary>${esc(s.title)} ${waits.has(s.id) ? `<span class="pill bad">Needs input</span>` : ""}<div class="meta">${fmt(s.updatedAt)} · ${s.total} messages${s.total > s.messages.length ? `, newest ${s.messages.length} shown` : ""}</div></summary>
      ${s.messages.filter((m) => showTools || m.role !== "tool").map((m) => m.role === "tool" ? `<div class="msg tool">&#8250; ${esc(m.text)}</div>` : `<div class="msg ${m.role}"><div class="meta">${who[m.role]} · ${fmt(m.at)}</div><div class="txt">${md(m.text)}</div></div>`).join("")}
      ${waits.has(s.id) ? `<div class="note warn">Claude is waiting on you. Answer in the USER INPUT NEEDED box above.</div>` : `<details><summary>Reply to this session</summary>${replyBox(`data-send="claude" data-session="${esc(s.id)}"`, "Message Claude")}<div class="note">Sends with <code>claude --resume</code> in the background. Avoid this while the same session is open in a terminal.</div></details>`}
    </details>`).join("");
  return jobPanel(p.key) + (sessions || `<div class="empty">No Claude Code sessions found for <code>${esc(p.dir)}</code>.</div>`);
}

// GitHub column: one newest-first timeline of issues, PRs, comments, commits and Actions runs.
const GH_TYPES = { attention: "Needs attention", all: "All activity", talk: "Issues & PRs", comment: "Comments", commit: "Commits", run: "Actions" };
const failedRun = (i) => i.type === "run" && /fail|cancel|timed|startup/.test(i.state || "");
// A failure only needs attention while it is that workflow's newest run; a later green run has fixed it.
const openFailures = (p) => { const seen = new Set(); return (p.remote.activity || []).filter((i) => { if (i.type !== "run") return false; const wf = i.title.split(": ")[0]; if (seen.has(wf)) return false; seen.add(wf); return failedRun(i); }); };
const openItem = (i) => (i.type === "issue" || i.type === "pr") && i.state !== "closed" && i.state !== "merged";
function ghCol(p) {
  const r = p.remote;
  if (!r.url) return `<div class="empty">No GitHub repo for this project.</div>`;
  const fails = openFailures(p);
  const list = (r.activity || []).filter((i) => ghFilter === "all" || i.type === ghFilter || (ghFilter === "talk" && (i.type === "issue" || i.type === "pr")) || (ghFilter === "attention" && (openItem(i) || fails.includes(i))));
  const stateCls = (s) => /fail|cancel|timed|startup/.test(s) ? "bad" : /success|merged|closed|completed/.test(s) ? "ok" : "warn";
  const label = (i) => i.type === "issue" ? `Issue #${i.number}` : i.type === "pr" ? `PR #${i.number}` : i.type === "comment" ? "Comment" : i.type === "commit" ? `Commit ${esc(i.sha)}` : "Action";
  return list.map((i) => `<div class="ev">
      <span class="pill">${label(i)}</span> <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> ${i.state ? `<span class="pill ${stateCls(i.state)}">${esc(i.state)}</span>` : ""}
      <div class="meta">${esc(i.author || "")} · ${fmt(i.at)}${i.created && i.created !== i.at ? " · opened " + fmt(i.created) : ""}</div>
      ${i.body ? `<details ${i.type === "comment" ? "open" : ""}><summary>Message</summary><div class="asktext">${md(i.body)}</div></details>` : ""}
      ${i.number && (i.type !== "issue" && i.type !== "pr" || i.state !== "closed") ? `<details><summary>Reply on GitHub</summary>${replyBox(`data-send="gh" data-number="${i.number}"`, `Comment on #${i.number}`, "Post comment")}</details>` : ""}
    </div>`).join("") || `<div class="empty">${ghFilter === "attention" ? "Nothing on GitHub needs you: no open issues or PRs, and no Actions workflow whose latest run failed. Pick All activity to see everything." : `No GitHub activity${ghFilter === "all" ? "" : " of this kind"}.`}</div>`;
}

// What needs doing in a project, worked out from the data, most urgent first. Each item says what to do, and the
// action plan (plan: true) gives it a checkbox and a button. ids are stable, so an item that drops out of the data
// after the fix is ticked off.
function todo(p) {
  const g = p.git, c = counts(p), items = [], k = p.key;
  const add = (pri, cls, id, what, todo, btn, plan = true, btn2 = null) => items.push({ id: k + "|" + id, key: k, pri, cls, what, todo, btn, plan, btn2 });
  if (p.loading) return [];
  const n = JOBS[k]?.status === "running" ? 0 : asking(p).length;
  if (JOBS[k]?.status === "running") add(9, "warn", "running", "Claude is working on this project right now.", "Wait for it to finish; the page updates by itself.", null, false);
  if (n) add(0, "bad", "answer", `Claude is waiting for your answer${n > 1 ? ` in ${n} places` : ""}.`, "Open the project and answer in the red box.", { label: "Answer", open: "" });
  if (p.error) add(1, "bad", "folder", esc(folderProblem(p)[0]), "What to do: " + folderProblem(p)[1], null);
  else {
    if (c.uncommitted) add(2, "warn", "commit", `${c.uncommitted} changed file${c.uncommitted > 1 ? "s" : ""} not committed.`, "Commit them (Git dropdown on the card).", { label: "Commit", git: "commit" });
    if (diverged(p)) add(3, "warn", "sync", `Diverged: ${g.ahead} commit(s) only on this PC, ${g.behind} only on GitHub.`, c.uncommitted ? "Commit first, then Fix diverged." : "Pick Fix diverged (pulls, then pushes).", c.uncommitted ? null : { label: "Fix diverged", git: "sync" });
    else if (g.behind) add(3, "warn", "pull", `GitHub has ${g.behind} newer commit(s) this PC doesn't have.`, c.uncommitted ? "Commit first, then Pull." : "Pull them.", c.uncommitted ? null : { label: "Pull", git: "pull" });
    else if (c.unpushed) add(4, "warn", "push", `${c.unpushed} commit(s) not pushed to GitHub.`, "Push them.", { label: "Push", git: "push" });
  }
  for (const i of openFailures(p).slice(0, 3)) add(1, "bad", "run|" + i.title.split(": ")[0], `Action failed: <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> (${fmt(i.at)})`, "Open it to see why, then ask Claude in this project to fix it.", { label: "See why", url: i.url });
  for (const x of p.remote.prs) add(x.isDraft ? 8 : 5, "warn", "pr|" + x.number, `${x.isDraft ? "Draft PR" : "PR"} <a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> waiting: ${esc(x.title)}`, x.isDraft ? "Still being worked on. Nothing to do yet." : "Review and merge it, or close it.", x.isDraft ? null : { label: "Review", open: "prs" }, !x.isDraft, { number: x.number });
  for (const i of p.remote.issues) add(6, "warn", "issue|" + i.number, `Issue <a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number}</a>: ${esc(i.title)}`, "Read it; ask Claude in this project to fix it, or close it if it no longer matters.", { label: "Read", open: "issues" }, true, { number: i.number, issue: true });
  return items.sort((a, b) => a.pri - b.pri);
}
// The short answer to "what needs me here?" at the top of a project.
function attention(p) {
  if (p.loading) return `<div class="attn"><b>What needs you</b> <span class="meta">Still loading this project's data...</span></div>`;
  const items = todo(p);
  return `<div class="attn"><b>What needs you</b>${items.length ? `<ul>${items.map((i) => `<li><span class="${i.cls}">&#9679;</span> ${i.what} <span class="meta">${esc(i.todo)}</span></li>`).join("")}</ul>` : ` <span class="ok">&#10003; Nothing. This project is up to date.</span>`}</div>`;
}

// Recommended actions across every project, shown once all of them have loaded. The list is kept in this browser:
// an item that is no longer in the data is ticked as fixed; one can also be ticked by hand. Fixed items stay for 7 days.
const PLAN_KEY = "projdash-plan";
let plan = (() => { try { return JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; } catch { return {}; } })(), planReady = false, planAll = false;
const PLAN_SHOW = 8; // the most urgent few; the rest behind "Show all"
const savePlan = () => { try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch {} };
function updatePlan() {
  const now = Date.now(), order = DATA.projects.map((p) => p.key);
  const cur = DATA.projects.flatMap((p) => todo(p).filter((i) => i.plan));
  if (DATA.projects.some((p) => p.loading)) return;
  const ids = new Set(cur.map((i) => i.id));
  cur.forEach((i, n) => { const old = plan[i.id]; plan[i.id] = { id: i.id, key: i.key, pri: i.pri, order: order.indexOf(i.key) * 1000 + n, what: i.what, todo: i.todo, btn: i.btn, btn2: i.btn2, open: true, ticked: !!(old?.open && old.ticked) }; });
  for (const it of Object.values(plan)) {
    if (!ids.has(it.id) && it.open) { it.open = false; it.doneAt = now; }
    if (!it.open && now - it.doneAt > 7 * 864e5) delete plan[it.id];
  }
  savePlan(); planReady = true;
}
function drawPlan() {
  const el = $("#plan");
  if (!planReady) { el.innerHTML = `<div class="plan"><b>Recommended actions</b> <span class="meta">The list appears when every project has loaded${building ? ` (${Math.min(doneCount, DATA.projects.length)} of ${DATA.projects.length} so far)` : ""}.</span></div>`; return; }
  const all = Object.values(plan).filter((i) => groupOf(i.key) === group), open = all.filter((i) => i.open).sort((a, b) => a.pri - b.pri || a.order - b.order), done = all.filter((i) => !i.open).sort((a, b) => b.doneAt - a.doneAt);
  const left = open.filter((i) => !i.ticked).length;
  const closeBtn = (i) => i.btn2 && !i.ticked ? `<button class="ibtn" ${i.btn2.issue ? "data-close-issue" : "data-close-pr"}="${i.btn2.number}" data-key="${esc(i.key)}">${i.btn2.issue ? "Close issue" : "Close PR"}</button>` : "";
  const button = (i) => closeBtn(i) + (!i.btn || i.ticked ? "" : i.btn.url ? `<a class="ibtn" style="text-decoration:none" href="${esc(i.btn.url)}" target="_blank" rel="noopener">${esc(i.btn.label)}</a>`
    : i.btn.git ? `<button class="ibtn" data-plan-git="${esc(i.btn.git)}" data-key="${esc(i.key)}" ${gitBusy[i.key] ? "disabled" : ""}>${esc(i.btn.label)}</button>`
    : `<button class="ibtn" data-plan-open="${esc(i.key)}" data-jump="${esc(i.btn.open)}">${esc(i.btn.label)}</button>`);
  const row = (i) => { const on = !i.open || i.ticked; return `<li class="${on ? "done" : ""}"><label><input type="checkbox" data-plan-tick="${esc(i.id)}" ${on ? "checked" : ""} ${i.open ? "" : `disabled title="Fixed: it's no longer in the data"`}><b>${esc(i.key)}</b>: ${i.what}</label>
    <span class="meta">${!i.open ? "&#10003; Fixed " + fmt(new Date(i.doneAt).toISOString()) : i.ticked ? "Ticked by you. It's still in the data, so check it's really done." : esc(i.todo)}</span>${button(i)}</li>`; };
  el.innerHTML = `<div class="plan"><div class="tools" style="margin:0;justify-content:space-between"><div><b>Recommended actions</b> <span class="meta">${open.length ? `${left} of ${open.length} still to do` : "All done"}${done.length ? ` · ${done.length} fixed` : ""}${building ? " · checking again..." : ""}</span></div>${done.length ? `<button class="ibtn" data-plan-clear>Clear fixed</button>` : ""}</div>
    ${open.length || done.length ? `<ol>${(planAll ? [...open, ...done] : [...open.slice(0, PLAN_SHOW), ...done.filter((i) => Date.now() - i.doneAt < 36e5)]).map(row).join("")}</ol>${open.length > PLAN_SHOW || done.length ? `<button class="ibtn" data-plan-all>${planAll ? "Show fewer" : `Show all ${open.length} to do${done.length ? ` and ${done.length} fixed` : ""}`}</button>` : ""}` : `<div class="ok" style="margin-top:6px">&#10003; Nothing to do. Every project is up to date.</div>`}</div>`;
}
$("#plan").addEventListener("change", (e) => { const id = e.target.dataset?.planTick; if (id && plan[id]) { plan[id].ticked = e.target.checked; savePlan(); drawPlan(); } });
$("#plan").addEventListener("click", (e) => {
  const t = e.target.closest("[data-plan-git],[data-plan-open],[data-plan-clear],[data-plan-all]");
  if (!t) return;
  if (t.dataset.planAll !== undefined) { planAll = !planAll; drawPlan(); }
  else if (t.dataset.planGit) gitAction(t.dataset.key, t.dataset.planGit);
  else if (t.dataset.planOpen) openProject(t.dataset.planOpen, t.dataset.jump || undefined);
  else { for (const it of Object.values(plan)) if (!it.open) delete plan[it.id]; savePlan(); drawPlan(); }
});

function fullView(p) {
  const [label, cls] = status(p), job = JOBS[p.key], busy = job?.status === "running" || job?.status === "waiting";
  return `<div class="fbar">
      <div class="grow"><h2 id="ftitle">${esc(p.key)} <span class="pill ${cls}">${label}</span> <span id="jobbadge">${badge(p.key)}</span></h2><div class="sub">${esc(p.name)} · <code>${esc(p.dir)}</code>${p.remote.url ? ` · <a href="${p.remote.url}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
      ${CMDS[p.key] && !busy ? `<button class="rbtn" style="margin:0" data-act="checkpoint">Checkpoint</button>` : ""}<span class="sub" id="cpmsg"></span>
      <div class="seg" role="group" aria-label="View"><button data-view="messages" aria-pressed="${view === "messages"}">Messages</button><button data-view="details" aria-pressed="${view === "details"}">Details</button></div>
      <button class="ibtn" data-act="fs" title="Browser full screen">${document.fullscreenElement ? "Exit full screen" : "Full screen"}</button>
      <button class="ibtn" data-act="close" title="Close (Esc)">&#10005; Close</button>
    </div>
    ${view === "focus" ? "" : attention(p) + needPanel(p)}
    <div class="fbody">${view === "focus" ? focusView(p) : view === "details" ? projectView(p) : `<div class="cols">
      <section class="col" aria-label="Claude messages"><h3>Claude messages <span class="note">${(p.sessions || []).length} recent sessions</span> <span class="filters"><button data-act="tools" aria-pressed="${showTools}">Show tool steps</button></span></h3><div class="colbody">${claudeCol(p)}</div></section>
      <section class="col" aria-label="GitHub messages"><h3>GitHub messages <span class="filters">${Object.entries(GH_TYPES).map(([k, n]) => `<button data-gh="${k}" aria-pressed="${ghFilter === k}">${n}</button>`).join("")}</span></h3><div class="colbody">${ghCol(p)}</div></section>
    </div>`}</div>`;
}
$("#full").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-view],[data-gh]");
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; render(); }
  else if (t.dataset.gh) { ghFilter = t.dataset.gh; render(); }
  else if (t.dataset.act === "close") closeProject();
  else if (t.dataset.act === "tools") { showTools = !showTools; render(); }
  else if (t.dataset.act === "checkpoint") checkpoint(tab);
  else if (t.dataset.act === "fs") (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}).finally(render);
});
document.addEventListener("fullscreenchange", () => { if (tab !== "overview") render(); });

function projectView(p) {
  if (p.loading) return `<div class="empty">This project's data is still loading. It appears here by itself.</div>`;
  if (p.error) return `<div class="empty bad">${esc(folderProblem(p)[0])}<br><b>What to do:</b> ${esc(folderProblem(p)[1])}<div class="meta">${esc(p.error)}</div></div>`;
  const g = p.git, r = p.remote;
  const sync =!g.upstream ? "No upstream branch" : `${g.ahead} ahead / ${g.behind} behind ${esc(g.upstream)}`;
  return `<div class="sub"><code>${esc(p.dir)}</code> · ${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">GitHub</a>` : "No GitHub repo"} · ${sync}${g.stashes ? " · " + g.stashes + " stash(es)" : ""}</div>
  <div class="sub">Last commit <code>${esc(g.last.hash)}</code> ${esc(g.last.subject)} (${ago(g.last.date)})</div>
  <h3 id="sec-commit">Items to commit (${g.files.length})</h3>
  ${g.files.length ? `<div class="tbl"><table><tr><th>State</th><th>Path</th></tr>${g.files.map((f) => `<tr><td><span class="pill ${f.kind === "conflict" ? "bad" : "warn"}">${f.kind}</span></td><td class="path">${esc(f.path)}</td></tr>`).join("")}</table></div>` : `<div class="empty">Working tree is clean.</div>`}
  ${g.unpushed.length ? `<h3 id="sec-unpushed">Commits not pushed (${g.unpushed.length})</h3>${diverged(p) ? `<div class="sub warn">Local and remote have diverged (${g.ahead} ahead, ${g.behind} behind). These may already be merged on GitHub under different hashes.</div>` : ""}<ul class="items">${g.unpushed.map((c) => `<li><code>${esc(c.slice(0, 7))}</code> ${esc(c.slice(8))}</li>`).join("")}</ul>` : ""}
  <h3 id="sec-issues">Outstanding issues (${r.issues.length})</h3>
  ${r.issues.map((i) => `<details class="issue" ${openIssues ? "open" : ""}><summary><a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number}</a> ${esc(i.title)} <span class="sub">· ${ago(i.updatedAt)}</span></summary><pre>${esc(i.body)}</pre></details>`).join("") || `<div class="empty">No open issues.</div>`}
  ${r.prs.length ? `<h3 id="sec-prs">Open pull requests (${r.prs.length})</h3><ul class="items">${r.prs.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> ${esc(x.title)}${x.isDraft ? " (draft)" : ""}</li>`).join("")}</ul>` : `<h3 id="sec-prs">Open pull requests (0)</h3><div class="empty">No open pull requests.</div>`}
  <h3>Status notes (PROJECT_STATUS.md)</h3>
  ${p.doc ? `<div class="sub">${esc(p.doc.headline)}</div>${p.doc.open.length ? `<ul class="items">${p.doc.open.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${p.doc.totalOpen > p.doc.open.length ? `<div class="sub">Showing ${p.doc.open.length} of ${p.doc.totalOpen}. See PROJECT_STATUS.md.</div>` : ""}` : `<div class="empty">No "still open" list in the newest entry.</div>`}` : `<div class="empty">No PROJECT_STATUS.md found.</div>`}`;
}

// Re-rendering keeps what the user has typed and where each pane was scrolled.
function render() {
  $("#detail").innerHTML = overview();
  const p = DATA.projects.find((x) => x.key === tab), full = $("#full");
  document.body.classList.toggle("locked", !!p);
  full.hidden = !p;
  if (!p) { full.innerHTML = ""; return; }
  const typed = [...full.querySelectorAll("textarea")].map((t) => t.value), scroll = [...full.querySelectorAll(".colbody,.fbody,.need")].map((el) => el.scrollTop);
  const focus = document.activeElement?.tagName === "TEXTAREA" ? [...full.querySelectorAll("textarea")].indexOf(document.activeElement) : -1;
  boxN = 0;
  full.innerHTML = fullView(p);
  full.querySelectorAll("textarea").forEach((t, i) => { if (typed[i]) { t.value = typed[i]; t.closest("details")?.setAttribute("open", ""); } });
  full.querySelectorAll(".colbody,.fbody,.need").forEach((el, i) => { if (scroll[i]) el.scrollTop = scroll[i]; });
  if (focus >= 0) full.querySelectorAll("textarea")[focus]?.focus();
  fetchSummaries(p);
}

// ---- Google: the search monitor (daily and weekly reports for each site), from search-monitor-data on GitHub.
let sTab = "overview";
const sView = {};
const host = (u) => { try { return new URL(u).pathname || "/"; } catch { return u; } };
const SITES = () => DATA.search?.sites || [];
function sStatus(s) {
  if (!s.setUp) return ["Not set up", "warn"];
  if (s.lastRun && s.lastRun.conclusion !== "success") return ["Last run " + (s.lastRun.conclusion || "running"), "bad"];
  const open = s.daily[0]?.open;
  if (open) return [open + " open findings", "warn"];
  return s.state && s.state.unknown === s.state.total ? ["No Google data yet", "warn"] : ["Healthy", "ok"];
}
function sCards() {
  const el = $("#scards");
  if (!DATA.search) { el.innerHTML = `<div class="card"><h2>Search monitor</h2><div class="big"><span class="spin sm" aria-hidden="true"></span> Loading...</div><div class="sub">Reading the latest reports from GitHub.</div></div>`; return; }
  if (DATA.search.failed) { el.innerHTML = `<div class="empty bad" style="grid-column:1/-1">The search monitor reports couldn't be read from GitHub.<br><b>What to do:</b> make sure the gh tool is signed in (in PowerShell: gh auth status), then click Refresh now.</div>`; return; }
  el.innerHTML = SITES().map((s) => {
    const [label, cls] = sStatus(s), st = s.state, d = s.daily[0];
    const hist = s.daily.slice(0, 14).reverse().filter((r) => r.open != null), max = Math.max(1, ...hist.map((r) => r.open));
    return `<div class="card pick" tabindex="0" role="button" data-sopen="${esc(s.repo)}"><h2>${esc(s.name)}</h2>
      <div class="big ${cls}">${esc(label)}</div>
      <div class="sub">${s.setUp ? "Last daily run " + ago(s.lastRun?.createdAt) : "Daily workflow not found in " + esc(s.repo)}</div>
      ${st ? `<div class="row"><div><b>${st.total}</b><small>URLs tracked</small></div><div><b class="ok">${st.indexed}</b><small>Indexed</small></div><div><b class="${st.notIndexed ? "bad" : ""}">${st.notIndexed}</b><small>Not indexed</small></div><div><b>${d?.fresh ?? "-"}</b><small>New today</small></div></div>` : ""}
      ${hist.length > 1 ? `<div class="spark" title="Open findings per daily run">${hist.map((r) => `<i style="height:${Math.max(6, r.open / max * 100)}%" title="${r.date}: ${r.open}"></i>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
}
function sTabs() {
  const items = [["overview", "Overview"], ...SITES().map((s) => [s.repo, s.name])];
  $("#stabs").innerHTML = items.map(([k, n]) => `<button aria-pressed="${sTab === k}" data-k="${esc(k)}">${esc(n)}</button>`).join("");
}
function sOverview() {
  const rows = SITES().flatMap((s) => s.daily.map((r) => ({ site: s.name, ...r }))).sort((a, b) => b.date.localeCompare(a.date) || a.site.localeCompare(b.site));
  const w = SITES().flatMap((s) => s.weekly.map((r) => ({ site: s.name, ...r }))).sort((a, b) => b.date.localeCompare(a.date));
  return `<h3>Recent daily results, all sites</h3>` + (rows.length ? `<div class="tbl"><table><tr><th>Date</th><th>Site</th><th>Sitemap</th><th>Checked</th><th>New</th><th>Open findings</th><th>Google</th></tr>
    ${rows.map((r) => `<tr><td>${r.date}</td><td>${esc(r.site)}</td><td>${r.sitemap ?? "-"}</td><td>${r.checked ?? "-"}</td><td>${r.fresh ?? "-"}</td><td>${r.open ?? "-"}</td><td>${esc(r.google)}</td></tr>`).join("")}</table></div>` : `<div class="empty">No daily reports yet.</div>`) +
    `<h3>Weekly reports</h3>` + (w.length ? w.map((r) => `<details><summary>${r.date} - ${esc(r.site)}</summary><pre>${esc(r.md)}</pre></details>`).join("") : `<div class="empty">No weekly reports yet. They post Mondays.</div>`);
}
function sSiteView(s) {
  if (!s.setUp) return `<div class="empty"><b>${esc(s.name)}</b> has no search monitor yet.<br><b>What to do:</b> run <code>/bwe-create-search-monitor-workflows</code> in the <code>${esc(s.repo)}</code> repo, then click Refresh now.</div>`;
  const f = sView[s.repo] ||= { q: "", kind: "", verdict: "" };
  const pages = s.state?.pages || [];
  const kinds = [...new Set(pages.flatMap((x) => x.findings.map((y) => y.kind)))].sort();
  const list = pages.filter((x) => (!f.q || x.url.toLowerCase().includes(f.q.toLowerCase())) &&
    (!f.kind || x.findings.some((y) => y.kind === f.kind)) && (!f.verdict || (f.verdict === "ok" ? x.verdict === "PASS" : x.verdict !== "PASS")))
    .sort((a, b) => (b.findings.length - a.findings.length) || a.url.localeCompare(b.url));
  const d = s.daily[0];
  return `<div class="sub"><a href="${s.url}/actions" target="_blank" rel="noopener">GitHub Actions</a> · <a href="${s.url}/issues?q=label%3Asearch-monitor" target="_blank" rel="noopener">Findings issue</a>${d ? ` · Sitemap: ${d.sitemap ?? "-"} URLs${d.sitemapNote ? " (" + esc(d.sitemapNote) + ")" : ""}` : ""}</div>
  <h3>Pages (${list.length} of ${pages.length})</h3>
  <div class="stools"><input id="sq" placeholder="Filter by URL" value="${esc(f.q)}">
    <select id="sk"><option value="">All findings</option>${kinds.map((k) => `<option ${f.kind === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
    <select id="sv"><option value="">All pages</option><option value="ok" ${f.verdict === "ok" ? "selected" : ""}>Indexed</option><option value="no" ${f.verdict === "no" ? "selected" : ""}>Not indexed / unknown</option></select></div>
  <div class="tbl"><table><tr><th>Page</th><th>Google</th><th>Last crawl</th><th>Findings</th></tr>
  ${list.slice(0, 300).map((x) => `<tr><td class="url"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(host(x.url))}</a></td>
    <td class="${x.verdict === "PASS" ? "ok" : "bad"}">${esc(x.coverage || x.verdict || "Not inspected")}</td><td>${x.lastCrawl ? x.lastCrawl.slice(0, 10) : "-"}</td>
    <td>${x.findings.map((y) => `<span class="pill ${y.severity === "high" ? "bad" : "warn"}" title="${esc(y.detail)}">${esc(y.kind)}</span>`).join(" ") || "-"}</td></tr>`).join("")}</table></div>
  ${list.length > 300 ? `<div class="sub">Showing first 300. Use the filters.</div>` : ""}
  <h3>Daily reports</h3>${s.daily.map((r, i) => `<details ${i === 0 ? "open" : ""}><summary>${r.date} · ${r.open ?? "-"} open findings · ${r.checked ?? "-"} checked</summary><pre>${esc(r.md)}</pre></details>`).join("") || `<div class="empty">No daily reports yet.</div>`}
  <h3>Weekly reports</h3>${s.weekly.map((r) => `<details><summary>${r.date}</summary><pre>${esc(r.md)}</pre></details>`).join("") || `<div class="empty">No weekly report yet. It posts Mondays.</div>`}`;
}
function sRender() {
  sCards(); sTabs();
  const s = SITES().find((x) => x.repo === sTab);
  $("#sdetail").innerHTML = !DATA.search ? "" : s ? sSiteView(s) : sOverview();
  if (!s || !s.setUp) return;
  const f = sView[s.repo], on = (id, key) => { const el = $(id); if (el) el.oninput = () => { f[key] = el.value; const pos = el.selectionStart; sRender(); const n = $(id); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }; };
  on("#sq", "q"); on("#sk", "kind"); on("#sv", "verdict");
}
$("#stabs").onclick = (e) => { const k = e.target.dataset.k; if (k) { sTab = k; sRender(); } };
$("#scards").onclick = (e) => { const c = e.target.closest("[data-sopen]"); if (c) { sTab = c.dataset.sopen; sRender(); $("#stabs").scrollIntoView({ block: "nearest" }); } };

// Four lists across every project, worked out from each project's open PRs and its newest deploy runs.
// Needs production = staging deployed OK and production has not caught up (or never ran). Deployed = production is current.
function releaseLists() {
  const L = { prs: [], errors: [], staging: [], needs: [], ok: [] }, t = (d) => Date.parse(d) || 0;
  for (const p of DATA.projects) {
    if (p.loading) continue;
    const k = p.key, d = p.remote.deploys || [], by = (s) => d.filter((x) => x.stage === s).sort((a, b) => t(b.at) - t(a.at))[0];
    for (const x of p.remote.prs) if (!x.isDraft) L.prs.push({ k, at: x.updatedAt, html: `<a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> ${esc(x.title)}`, note: "updated " + fmt(x.updatedAt) });
    for (const x of d) if (x.state === "failure" || x.state === "timed_out" || x.state === "startup_failure") L.errors.push({ k, at: x.at, html: `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.workflow)}</a> failed`, note: fmt(x.at) + " · open it to see why" });
    const st = by("staging"), pr = by("production");
    // Needs staging = GitHub has a commit newer than the newest staging run (or staging never ran).
    const commit = (p.remote.activity || []).find((i) => i.type === "commit");
    if (st && commit && t(commit.at) > t(st.at)) L.staging.push({ k, at: commit.at, html: `<a href="${esc(commit.url)}" target="_blank" rel="noopener">${esc(commit.title)}</a>`, note: `committed ${fmt(commit.at)} · last staging ${fmt(st.at)}${st.state === "success" ? "" : " (" + esc(String(st.state).replace(/_/g, " ")) + ")"}` });
    if (st?.state === "success" && (!pr || (pr.state === "success" && t(st.at) > t(pr.at)))) L.needs.push({ k, at: st.at, html: `Staging is deployed, production ${pr ? "is older" : "never deployed"}`, note: `staging ${fmt(st.at)}${pr ? " · production " + fmt(pr.at) : ""}` });
    else if (pr?.state === "success") L.ok.push({ k, at: pr.at, html: `<a href="${esc(pr.url)}" target="_blank" rel="noopener">Production deployed</a>`, note: fmt(pr.at) });
  }
  return L;
}
function drawLists() {
  const el = $("#lists");
  if (!planReady) { el.innerHTML = ""; return; } // shown once every project has loaded, like the actions
  const L = releaseLists();
  const box = (title, arr, empty, cls) => `<div class="box"><h3>${title} <span class="pill ${arr.length ? cls : "ok"}">${arr.length}</span></h3>${arr.length ? `<ul>${arr.sort((a, b) => Date.parse(b.at) - Date.parse(a.at)).map((i) => `<li><span class="k" data-lopen="${esc(i.k)}">${esc(i.k)}</span>: ${i.html} <span class="meta">${i.note}</span></li>`).join("")}</ul>` : `<div class="meta">${empty}</div>`}</div>`;
  el.innerHTML = `<div class="lists">${box("PRs to merge", L.prs, "No open pull requests.", "warn")}${box("Deployment errors", L.errors, "No failed deployments.", "bad")}${box("Needs staging deployment", L.staging, "Staging has the latest commit everywhere.", "warn")}${box("Needs production deployment", L.needs, "Production is up to date everywhere.", "warn")}${box("Successfully deployed", L.ok, "No production deployments found.", "ok")}</div>`;
}
$("#lists").onclick = (e) => { const k = e.target.closest("[data-lopen]")?.dataset.lopen; if (!k) return; const g = groupOf(k); if (g && g !== group) setGroup(g); openProject(k); };

// The section bar. Each section shows how many things need you.
function groupsNav() {
  const open = (g) => Object.values(plan).filter((i) => i.open && !i.ticked && groupOf(i.key) === g).length;
  const n = (g) => g === "google" ? (SITES().reduce((a, s) => a + (s.daily[0]?.open || 0), 0)) : planReady ? open(g) : 0;
  $("#groups").innerHTML = GROUPS.map(([k, name]) => `<button aria-pressed="${group === k}" data-g="${k}">${name}${n(k) ? `<span class="gn" title="${k === "google" ? "Open search findings" : "Actions waiting"}">${n(k)}</span>` : ""}</button>`).join("");
}
// Close a pull request (never merged; its branch is kept) or an issue on GitHub. Asks first.
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-close-pr],[data-close-issue]"); if (!b) return;
  const issue = b.dataset.closeIssue !== undefined, n = issue ? b.dataset.closeIssue : b.dataset.closePr, key = b.dataset.key, noun = issue ? "issue" : "pull request";
  const r0 = DATA.projects.find((x) => x.key === key)?.remote, item = (issue ? r0?.issues : r0?.prs)?.find((x) => String(x.number) === n);
  if (!confirm(`Close ${noun} #${n}${item ? ` "${item.title}"` : ""} in ${key} on GitHub?\n\n${issue ? "It is marked closed on GitHub. You can reopen it there." : "It is closed without merging. Its changes are not used, and its branch is kept."}`)) return;
  if (!live) { alert(`This page was opened as a file, so it can't close a ${noun}.\nWhat to do: double-click refresh.cmd and use the page it opens (http://127.0.0.1:8788).`); return; }
  const label = b.textContent; b.disabled = true; b.textContent = "Closing...";
  try {
    const r = await fetch("/gh-close/" + encodeURIComponent(key), { method: "POST", body: JSON.stringify({ number: Number(n), kind: issue ? "issue" : "pr" }) });
    if (!r.ok) throw new Error(await r.text());
    refresh(); // the lists are rebuilt from GitHub, so the closed item drops out and its action is ticked as Fixed
  } catch (err) {
    b.disabled = false; b.textContent = label;
    alert(/What to do:/.test(err.message) ? err.message : /failed to fetch|networkerror/i.test(err.message) ? offline : err.message + "\nWhat to do: try again. If it keeps failing, send a screenshot of this message to Claude.");
  }
});
$("#groups").onclick = (e) => { const g = e.target.closest("[data-g]")?.dataset.g; if (g) setGroup(g); };
function setGroup(g) {
  if (g === group) return;
  if (tab !== "overview") closeProject();
  group = g; try { localStorage.setItem(GROUP_KEY, g); } catch {}
  showGroup();
}
function showGroup() {
  $("#gProjects").hidden = group === "google"; $("#gGoogle").hidden = group !== "google";
  groupsNav();
  if (group === "google") sRender(); else { cards(); tabs(); render(); drawPlan(); drawLists(); }
}
showGroup();
if (live) poll().then(watchBuild); else { updatePlan(); drawPlan(); drawLists(); } // a file copy shows the data it was saved with
</script>
</body>
</html>
