  const fails = openFailures(p);
  const list = (r.activity || []).filter((i) => ghFilter === "all" || i.type === ghFilter || (ghFilter === "talk" && (i.type === "issue" || i.type === "pr")) || (ghFilter === "attention" && (openItem(i) || fails.includes(i))));
  const stateCls = (s) => /fail|cancel|timed|startup/.test(s) ? "bad" : /success|merged|closed|completed/.test(s) ? "ok" : "warn";
  const label = (i) => i.type === "issue" ? `Issue #${i.number}` : i.type === "pr" ? `PR #${i.number}` : i.type === "comment" ? "Comment" : i.type === "commit" ? `Commit ${esc(i.sha)}` : "Action";
  return list.map((i) => `<div class="ev">

      <div class="meta">${esc(i.author || "")} · ${fmt(i.at)}${i.created && i.created !== i.at ? " · opened " + fmt(i.created) : ""}</div>
      ${i.body ? `<details ${i.type === "comment" ? "open" : ""}><summary>Message</summary><div class="asktext">${md(i.body)}</div></details>` : ""}
      ${i.number && (i.type !== "issue" && i.type !== "pr" || i.state !== "closed") ? `<details><summary>Reply on GitHub</summary>${replyBox(`data-send="gh" data-number="${i.number}"`, `Comment on #${i.number}`, "Post comment")}</details>` : ""}
    </div>`).join("") || `<div class="empty">${ghFilter === "attention" ? "Nothing on GitHub needs you: no open issues or PRs, and no Actions workflow whose latest run failed. Pick All activity to see everything." : `No GitHub activity${ghFilter === "all" ? "" : " of this kind"}.`}</div>`;

// What needs doing in a project, worked out from the data, most urgent first. Each item says what to do, and the
// action plan (plan: true) gives it a checkbox and a button. ids are stable, so an item that drops out of the data
// after the fix is ticked off.
function todo(p) {
  const g = p.git, c = counts(p), items = [], k = p.key;
  const add = (pri, cls, id, what, todo, btn, plan = true) => items.push({ id: k + "|" + id, key: k, pri, cls, what, todo, btn, plan });
  if (p.loading) return [];
  const n = JOBS[k]?.status === "running" ? 0 : asking(p).length;
  if (JOBS[k]?.status === "running") add(9, "warn", "running", "Claude is working on this project right now.", "Wait for it to finish; the page updates by itself.", null, false);
  if (n) add(0, "bad", "answer", `Claude is waiting for your answer${n > 1 ? ` in ${n} places` : ""}.`, "Open the project and answer in the red box.", { label: "Answer", open: "" });
  if (p.error) add(1, "bad", "folder", esc(folderProblem(p)[0]), "What to do: " + folderProblem(p)[1], null);
  else {
    if (c.uncommitted) add(2, "warn", "commit", `${c.uncommitted} changed file${c.uncommitted > 1 ? "s" : ""} not committed.`, "Commit them (Git dropdown on the card).", { label: "Commit", git: "commit" });
    if (diverged(p)) add(3, "warn", "sync", `Diverged: ${g.ahead} commit(s) only on this PC, ${g.behind} only on GitHub.`, c.uncommitted ? "Commit first, then Fix diverged." : "Pick Fix diverged (pulls, then pushes).", c.uncommitted ? null : { label: "Fix diverged", git: "sync" });
    else if (g.behind) add(3, "warn", "pull", `GitHub has ${g.behind} newer commit(s) this PC doesn't have.`, c.uncommitted ? "Commit first, then Pull." : "Pull them.", c.uncommitted ? null : { label: "Pull", git: "pull" });
    else if (c.unpushed) add(4, "warn", "push", `${c.unpushed} commit(s) not pushed to GitHub.`, "Push them.", { label: "Push", git: "push" });
  }
  for (const i of openFailures(p).slice(0, 3)) add(1, "bad", "run|" + i.title.split(": ")[0], `Action failed: <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> (${fmt(i.at)})`, "Open it to see why, then ask Claude in this project to fix it.", { label: "See why", url: i.url });
  for (const x of p.remote.prs) add(x.isDraft ? 8 : 5, "warn", "pr|" + x.number, `${x.isDraft ? "Draft PR" : "PR"} <a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> waiting: ${esc(x.title)}`, x.isDraft ? "Still being worked on. Nothing to do yet." : "Review and merge it, or close it.", x.isDraft ? null : { label: "Review", open: "prs" }, !x.isDraft);
  for (const i of p.remote.issues) add(6, "warn", "issue|" + i.number, `Issue <a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number}</a>: ${esc(i.title)}`, "Read it; ask Claude in this project to fix it, or close it if it no longer matters.", { label: "Read", open: "issues" });
  return items.sort((a, b) => a.pri - b.pri);
}
// The short answer to "what needs me here?" at the top of a project.
function attention(p) {
  if (p.loading) return `<div class="attn"><b>What needs you</b> <span class="meta">Still loading this project's data...</span></div>`;
  const items = todo(p);
  return `<div class="attn"><b>What needs you</b>${items.length ? `<ul>${items.map((i) => `<li><span class="${i.cls}">&#9679;</span> ${i.what} <span class="meta">${esc(i.todo)}</span></li>`).join("")}</ul>` : ` <span class="ok">&#10003; Nothing. This project is up to date.</span>`}</div>`;
}

// Recommended actions across every project, shown once all of them have loaded. The list is kept in this browser:
// an item that is no longer in the data is ticked as fixed; one can also be ticked by hand. Fixed items stay for 7 days.
const PLAN_KEY = "projdash-plan";
let plan = (() => { try { return JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; } catch { return {}; } })(), planReady = false, planAll = false;
const PLAN_SHOW = 8; // the most urgent few; the rest behind "Show all"
const savePlan = () => { try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch {} };
function updatePlan() {
  const now = Date.now(), order = DATA.projects.map((p) => p.key);
  const cur = DATA.projects.flatMap((p) => todo(p).filter((i) => i.plan));
  if (DATA.projects.some((p) => p.loading)) return;
  const ids = new Set(cur.map((i) => i.id));
  cur.forEach((i, n) => { const old = plan[i.id]; plan[i.id] = { id: i.id, key: i.key, pri: i.pri, order: order.indexOf(i.key) * 1000 + n, what: i.what, todo: i.todo, btn: i.btn, open: true, ticked: !!(old?.open && old.ticked) }; });
  for (const it of Object.values(plan)) {
    if (!ids.has(it.id) && it.open) { it.open = false; it.doneAt = now; }
    if (!it.open && now - it.doneAt > 7 * 864e5) delete plan[it.id];
  }
  savePlan(); planReady = true;
}
function drawPlan() {
  const el = $("#plan");
  if (!planReady) { el.innerHTML = `<div class="plan"><b>Recommended actions</b> <span class="meta">The list appears when every project has loaded${building ? ` (${doneCount} of ${DATA.projects.length} so far)` : ""}.</span></div>`; return; }
  const all = Object.values(plan), open = all.filter((i) => i.open).sort((a, b) => a.pri - b.pri || a.order - b.order), done = all.filter((i) => !i.open).sort((a, b) => b.doneAt - a.doneAt);
  const left = open.filter((i) => !i.ticked).length;
  const button = (i) => !i.btn || i.ticked ? "" : i.btn.url ? `<a class="ibtn" style="text-decoration:none" href="${esc(i.btn.url)}" target="_blank" rel="noopener">${esc(i.btn.label)}</a>`
    : i.btn.git ? `<button class="ibtn" data-plan-git="${esc(i.btn.git)}" data-key="${esc(i.key)}" ${gitBusy[i.key] ? "disabled" : ""}>${esc(i.btn.label)}</button>`
    : `<button class="ibtn" data-plan-open="${esc(i.key)}" data-jump="${esc(i.btn.open)}">${esc(i.btn.label)}</button>`;
  const row = (i) => { const on = !i.open || i.ticked; return `<li class="${on ? "done" : ""}"><label><input type="checkbox" data-plan-tick="${esc(i.id)}" ${on ? "checked" : ""} ${i.open ? "" : `disabled title="Fixed: it's no longer in the data"`}><b>${esc(i.key)}</b>: ${i.what}</label>
    <span class="meta">${!i.open ? "&#10003; Fixed " + fmt(new Date(i.doneAt).toISOString()) : i.ticked ? "Ticked by you. It's still in the data, so check it's really done." : esc(i.todo)}</span>${button(i)}</li>`; };
  el.innerHTML = `<div class="plan"><div class="tools" style="margin:0;justify-content:space-between"><div><b>Recommended actions</b> <span class="meta">${open.length ? `${left} of ${open.length} still to do` : "All done"}${done.length ? ` · ${done.length} fixed` : ""}${building ? " · checking again..." : ""}</span></div>${done.length ? `<button class="ibtn" data-plan-clear>Clear fixed</button>` : ""}</div>
    ${open.length || done.length ? `<ol>${(planAll ? [...open, ...done] : [...open.slice(0, PLAN_SHOW), ...done.filter((i) => Date.now() - i.doneAt < 36e5)]).map(row).join("")}</ol>${open.length > PLAN_SHOW || done.length ? `<button class="ibtn" data-plan-all>${planAll ? "Show fewer" : `Show all ${open.length} to do${done.length ? ` and ${done.length} fixed` : ""}`}</button>` : ""}` : `<div class="ok" style="margin-top:6px">&#10003; Nothing to do. Every project is up to date.</div>`}</div>`;
}
$("#plan").addEventListener("change", (e) => { const id = e.target.dataset?.planTick; if (id && plan[id]) { plan[id].ticked = e.target.checked; savePlan(); drawPlan(); } });
$("#plan").addEventListener("click", (e) => {
  const t = e.target.closest("[data-plan-git],[data-plan-open],[data-plan-clear],[data-plan-all]");
  if (!t) return;
  if (t.dataset.planAll !== undefined) { planAll = !planAll; drawPlan(); }
  else if (t.dataset.planGit) gitAction(t.dataset.key, t.dataset.planGit);
  else if (t.dataset.planOpen) openProject(t.dataset.planOpen, t.dataset.jump || undefined);
  else { for (const it of Object.values(plan)) if (!it.open) delete plan[it.id]; savePlan(); drawPlan(); }
});

function fullView(p) {
  const [label, cls] = status(p), job = JOBS[p.key], busy = job?.status === "running" || job?.status === "waiting";
  return `<div class="fbar">
      <div class="grow"><h2 id="ftitle">${esc(p.key)} <span class="pill ${cls}">${label}</span> <span id="jobbadge">${badge(p.key)}</span></h2><div class="sub">${esc(p.name)} · <code>${esc(p.dir)}</code>${p.remote.url ? ` · <a href="${p.remote.url}" target="_blank" rel="noopener">GitHub</a>` : ""}</div></div>
      ${CMDS[p.key] && !busy ? `<button class="rbtn" style="margin:0" data-act="checkpoint">Checkpoint</button>` : ""}<span class="sub" id="cpmsg"></span>
      <div class="seg" role="group" aria-label="View"><button data-view="messages" aria-pressed="${view === "messages"}">Messages</button><button data-view="details" aria-pressed="${view === "details"}">Details</button></div>
      <button class="ibtn" data-act="fs" title="Browser full screen">${document.fullscreenElement ? "Exit full screen" : "Full screen"}</button>
      <button class="ibtn" data-act="close" title="Close (Esc)">&#10005; Close</button>
    </div>
    ${view === "focus" ? "" : attention(p) + needPanel(p)}
    <div class="fbody">${view === "focus" ? focusView(p) : view === "details" ? projectView(p) : `<div class="cols">
      <section class="col" aria-label="Claude messages"><h3>Claude messages <span class="note">${(p.sessions || []).length} recent sessions</span> <span class="filters"><button data-act="tools" aria-pressed="${showTools}">Show tool steps</button></span></h3><div class="colbody">${claudeCol(p)}</div></section>
      <section class="col" aria-label="GitHub messages"><h3>GitHub messages <span class="filters">${Object.entries(GH_TYPES).map(([k, n]) => `<button data-gh="${k}" aria-pressed="${ghFilter === k}">${n}</button>`).join("")}</span></h3><div class="colbody">${ghCol(p)}</div></section>
    </div>`}</div>`;
}
$("#full").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-view],[data-gh]");
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; render(); }
  else if (t.dataset.gh) { ghFilter = t.dataset.gh; render(); }
  else if (t.dataset.act === "close") closeProject();
  else if (t.dataset.act === "tools") { showTools = !showTools; render(); }
  else if (t.dataset.act === "checkpoint") checkpoint(tab);
  else if (t.dataset.act === "fs") (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}).finally(render);
});
document.addEventListener("fullscreenchange", () => { if (tab !== "overview") render(); });

function projectView(p) {
  if (p.loading) return `<div class="empty">This project's data is still loading. It appears here by itself.</div>`;
  if (p.error) return `<div class="empty bad">${esc(folderProblem(p)[0])}<br><b>What to do:</b> ${esc(folderProblem(p)[1])}<div class="meta">${esc(p.error)}</div></div>`;
  const g = p.git, r = p.remote;
  const sync =!g.upstream ? "No upstream branch" : `${g.ahead} ahead / ${g.behind} behind ${esc(g.upstream)}`;
  return `<div class="sub"><code>${esc(p.dir)}</code> · ${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">GitHub</a>` : "No GitHub repo"} · ${sync}${g.stashes ? " · " + g.stashes + " stash(es)" : ""}</div>
  <div class="sub">Last commit <code>${esc(g.last.hash)}</code> ${esc(g.last.subject)} (${ago(g.last.date)})</div>
  <h3 id="sec-commit">Items to commit (${g.files.length})</h3>
  ${g.files.length ? `<div class="tbl"><table><tr><th>State</th><th>Path</th></tr>${g.files.map((f) => `<tr><td><span class="pill ${f.kind === "conflict" ? "bad" : "warn"}">${f.kind}</span></td><td class="path">${esc(f.path)}</td></tr>`).join("")}</table></div>` : `<div class="empty">Working tree is clean.</div>`}
  ${g.unpushed.length ? `<h3 id="sec-unpushed">Commits not pushed (${g.unpushed.length})</h3>${diverged(p) ? `<div class="sub warn">Local and remote have diverged (${g.ahead} ahead, ${g.behind} behind). These may already be merged on GitHub under different hashes.</div>` : ""}<ul class="items">${g.unpushed.map((c) => `<li><code>${esc(c.slice(0, 7))}</code> ${esc(c.slice(8))}</li>`).join("")}</ul>` : ""}
  <h3 id="sec-issues">Outstanding issues (${r.issues.length})</h3>
  ${r.issues.map((i) => `<details class="issue" ${openIssues ? "open" : ""}><summary><a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number}</a> ${esc(i.title)} <span class="sub">· ${ago(i.updatedAt)}</span></summary><pre>${esc(i.body)}</pre></details>`).join("") || `<div class="empty">No open issues.</div>`}
  ${r.prs.length ? `<h3 id="sec-prs">Open pull requests (${r.prs.length})</h3><ul class="items">${r.prs.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> ${esc(x.title)}${x.isDraft ? " (draft)" : ""}</li>`).join("")}</ul>` : `<h3 id="sec-prs">Open pull requests (0)</h3><div class="empty">No open pull requests.</div>`}
  <h3>Status notes (PROJECT_STATUS.md)</h3>
  ${p.doc ? `<div class="sub">${esc(p.doc.headline)}</div>${p.doc.open.length ? `<ul class="items">${p.doc.open.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${p.doc.totalOpen > p.doc.open.length ? `<div class="sub">Showing ${p.doc.open.length} of ${p.doc.totalOpen}. See PROJECT_STATUS.md.</div>` : ""}` : `<div class="empty">No "still open" list in the newest entry.</div>`}` : `<div class="empty">No PROJECT_STATUS.md found.</div>`}`;
}

// Re-rendering keeps what the user has typed and where each pane was scrolled.
function render() {
  $("#detail").innerHTML = overview();
  const p = DATA.projects.find((x) => x.key === tab), full = $("#full");
  document.body.classList.toggle("locked", !!p);
  full.hidden = !p;
  if (!p) { full.innerHTML = ""; return; }
  const typed = [...full.querySelectorAll("textarea")].map((t) => t.value), scroll = [...full.querySelectorAll(".colbody,.fbody,.need")].map((el) => el.scrollTop);
  const focus = document.activeElement?.tagName === "TEXTAREA" ? [...full.querySelectorAll("textarea")].indexOf(document.activeElement) : -1;
  boxN = 0;
  full.innerHTML = fullView(p);
  full.querySelectorAll("textarea").forEach((t, i) => { if (typed[i]) { t.value = typed[i]; t.closest("details")?.setAttribute("open", ""); } });
  full.querySelectorAll(".colbody,.fbody,.need").forEach((el, i) => { if (scroll[i]) el.scrollTop = scroll[i]; });
  if (focus >= 0) full.querySelectorAll("textarea")[focus]?.focus();
  fetchSummaries(p);
}
cards(); tabs(); render();
if (live) poll().then(watchBuild); else { updatePlan(); drawPlan(); } // a file copy shows the data it was saved with
</script>
</body>
</html>
